<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Streetlifting Tracker</title>
<style>
/* [AJOUT] Police Rajdhani (titres + valeurs numériques) */
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap');
/* [AJOUT] Palette Solo Leveling (violet / cyan néon) */
:root{
  --bg:#0a0a0f; --bg2:#0f0f1a; --bg3:#1a1a2e; --line:#262645;
  --txt:#e6edf3; --dim:#9aa0c0; --faint:#5a5a7a;
  --acc:#7B2FBE; --acc2:#9D50E0; --good:#00ff88; --warn:#d29922; --bad:#ff4d6d;
  --blue:#00D4FF; --purple:#bc8cff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  padding-bottom:calc(120px + env(safe-area-inset-bottom));min-height:100vh;overscroll-behavior-y:contain}
#app{max-width:560px;margin:0 auto;padding:12px 12px 0}
h1{font-size:1.15rem;font-weight:800;letter-spacing:.3px}
h2{font-size:.95rem;font-weight:700;margin:18px 0 8px;color:var(--acc2)}
.sub{color:var(--dim);font-size:.78rem;margin-top:2px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card.tight{padding:10px 12px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{background:var(--bg3);border:1px solid var(--line);color:var(--dim);border-radius:99px;
  padding:6px 12px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc2);color:#fff;box-shadow:0 0 8px rgba(157,80,224,.5)}
.chip.done{border-color:var(--good);color:var(--good)}
.badge{font-size:.66rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg3);color:var(--dim)}
.badge.acc{background:rgba(157,80,224,.15);color:var(--acc2)}
.badge.good{background:rgba(0,255,136,.12);color:var(--good)}
.badge.warn{background:rgba(210,153,34,.15);color:var(--warn)}
.badge.bad{background:rgba(255,77,109,.15);color:var(--bad)}
.badge.blue{background:rgba(0,212,255,.12);color:var(--blue)}
button{font-family:inherit;cursor:pointer;border:none}
.btn{background:var(--acc);color:#fff;font-weight:800;border-radius:12px;padding:13px 16px;
  font-size:.92rem;width:100%;margin-top:8px;box-shadow:0 0 12px rgba(123,47,190,.35)}
.btn.ghost{background:var(--bg3);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.small{width:auto;padding:8px 14px;font-size:.78rem;margin:0}
.btn.danger{background:rgba(255,77,109,.15);color:var(--bad);border:1px solid rgba(255,77,109,.4);box-shadow:none}
input,select,textarea{background:var(--bg3);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:10px;font-size:16px;font-family:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
label{font-size:.74rem;color:var(--dim);font-weight:600;display:block;margin:10px 0 4px}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{text-align:left;color:var(--faint);font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;
  padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid rgba(38,38,69,.55);vertical-align:top}
tr:last-child td{border-bottom:none}
/* ===== exercise / set rows ===== */
.ex{border-top:1px solid var(--line);padding:11px 0}
.ex:first-child{border-top:none;padding-top:2px}
.ex-name{font-weight:700;font-size:.92rem}
.ex-rx{color:var(--acc2);font-weight:700;font-size:.84rem;white-space:nowrap}
.ex-note{color:var(--dim);font-size:.74rem;margin-top:3px;line-height:1.35}
.sets{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 1fr 42px;gap:6px;align-items:center}
.set .n{color:var(--faint);font-size:.74rem;font-weight:700;text-align:center}
.set input{padding:8px 6px;text-align:center;font-size:15px;border-radius:9px}
.set input::placeholder{color:var(--faint)}
.ck{width:42px;height:38px;border-radius:9px;background:var(--bg3);border:1px solid var(--line);
  color:var(--faint);font-size:1rem;font-weight:800}
.ck.on{background:var(--good);border-color:var(--good);color:#06150a}
.set-head{display:grid;grid-template-columns:26px 1fr 1fr 1fr 42px;gap:6px;
  font-size:.62rem;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;text-align:center;margin-top:8px}
/* ===== bottom nav ===== */
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,15,.97);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  backdrop-filter:blur(12px);z-index:50}
nav button{background:none;color:var(--faint);font-size:.62rem;font-weight:700;display:flex;
  flex-direction:column;align-items:center;gap:2px;padding:4px 10px;border-radius:10px;flex:1;max-width:90px}
nav button .ic{font-size:1.25rem}
nav button.on{color:var(--acc)}
/* ===== timer bar ===== */
#timerbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:49;
  display:none;justify-content:center;pointer-events:none}
#timerbar .inner{pointer-events:auto;background:var(--bg3);border:1px solid var(--acc);border-radius:99px;
  display:flex;align-items:center;gap:10px;padding:8px 14px;box-shadow:0 6px 24px rgba(0,0,0,.5);margin:0 12px}
#timerbar .t{font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--acc2);min-width:64px;text-align:center}
#timerbar button{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:99px;
  width:34px;height:34px;font-size:.8rem;font-weight:700}
/* ===== modal ===== */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:none;align-items:flex-end;justify-content:center}
#modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto}
canvas{width:100%;height:auto;display:block}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stat{background:var(--bg3);border-radius:12px;padding:10px}
.stat .v{font-size:1.25rem;font-weight:800;color:var(--acc2)}
.stat .l{font-size:.66rem;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.hero{background:linear-gradient(135deg,#16162e,#0f0f1a);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.prog-track{height:6px;background:var(--bg3);border-radius:99px;margin-top:10px;overflow:hidden}
/* [AJOUT] effet néon sur les barres de progression */
.prog-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;
  box-shadow:0 0 10px var(--acc2),0 0 22px rgba(157,80,224,.45)}
details{border-top:1px solid var(--line)}
details summary{padding:11px 0;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
.muted{color:var(--dim);font-size:.8rem;line-height:1.45}
.checkrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid rgba(38,38,69,.55);cursor:pointer}
.checkrow .box2{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:.8rem;color:#06150a;font-weight:900;margin-top:1px}
.checkrow.on .box2{background:var(--good);border-color:var(--good)}
.checkrow.on .tx{color:var(--dim);text-decoration:line-through}
.pill-input{display:flex;gap:8px;align-items:center}
.pill-input input{text-align:center}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--good);
  color:var(--txt);padding:10px 18px;border-radius:99px;font-size:.82rem;font-weight:600;z-index:200;
  box-shadow:0 6px 20px rgba(0,0,0,.5);display:none;white-space:nowrap}
.lift-chip{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;flex:1}
.lift-chip b{font-size:.92rem;white-space:nowrap}
/* [AJOUT] ===== Solo Leveling : police, HUD de rang, streak, RANK UP ===== */
h1,h2,.stat .v,#timerbar .t,.ex-rx,.lift-chip b{font-family:'Rajdhani',-apple-system,sans-serif;letter-spacing:.5px}
.rank-hud{position:relative;background:linear-gradient(135deg,rgba(123,47,190,.14),rgba(0,212,255,.05)),var(--bg2);
  border:1px solid rgba(157,80,224,.5);border-radius:10px;padding:14px;margin-bottom:12px;
  box-shadow:0 0 16px rgba(123,47,190,.25),inset 0 0 28px rgba(123,47,190,.07)}
.rank-hud::before,.rank-hud::after{content:'';position:absolute;width:14px;height:14px;border:2px solid var(--blue);opacity:.85}
.rank-hud::before{top:-1px;left:-1px;border-right:none;border-bottom:none;border-radius:10px 0 0 0}
.rank-hud::after{bottom:-1px;right:-1px;border-left:none;border-top:none;border-radius:0 0 10px 0}
.rank-badge2{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.9rem;width:54px;height:54px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;border:2px solid currentColor;border-radius:8px;
  background:rgba(0,0,0,.35);text-shadow:0 0 12px currentColor;box-shadow:0 0 12px rgba(157,80,224,.45),inset 0 0 12px rgba(157,80,224,.2)}
.rank-label{font-size:.62rem;letter-spacing:2px;color:var(--blue);text-transform:uppercase;font-weight:700}
.rank-total{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.35rem;line-height:1.2}
.streak-pill{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.05rem;white-space:nowrap;
  background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.4);border-radius:99px;padding:6px 12px;
  box-shadow:0 0 10px rgba(0,212,255,.25)}
.rank-track{height:8px;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:99px;margin-top:12px;overflow:hidden}
.rank-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--blue));border-radius:99px;
  box-shadow:0 0 10px var(--blue),0 0 20px rgba(0,212,255,.5)}
.rank-next{font-size:.7rem;color:var(--dim);margin-top:6px;letter-spacing:.4px}
#rankup{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(6,4,14,.93);text-align:center;padding:20px}
#rankup.show{display:flex;animation:ruFlash .9s ease-out}
#rankup .ru-txt{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:2rem;letter-spacing:6px;color:var(--blue);
  white-space:nowrap;text-shadow:0 0 18px var(--blue),0 0 40px var(--blue);animation:ruPop .7s cubic-bezier(.2,1.6,.4,1)}
#rankup .ru-rank{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:7rem;line-height:1;margin-top:10px;
  text-shadow:0 0 24px currentColor,0 0 60px currentColor;animation:ruPop .9s cubic-bezier(.2,1.6,.4,1)}
#rankup .ru-sub{color:var(--dim);font-size:.78rem;margin-top:16px;letter-spacing:1px}
@keyframes ruFlash{0%{background:rgba(157,80,224,.9)}30%{background:rgba(0,212,255,.35)}100%{background:rgba(6,4,14,.93)}}
@keyframes ruPop{0%{transform:scale(2.6);opacity:0}60%{opacity:1}100%{transform:scale(1);opacity:1}}
/* [AJOUT] ===== Éclairs violets Solo Leveling ===== */
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 60% 40% at 50% -5%,rgba(123,47,190,.22),transparent 70%),
             radial-gradient(ellipse 40% 30% at 85% 100%,rgba(0,212,255,.07),transparent 70%);
  animation:auraPulse 6s ease-in-out infinite}
@keyframes auraPulse{0%,100%{opacity:.7}50%{opacity:1}}
.bolt{position:absolute;pointer-events:none;filter:drop-shadow(0 0 6px var(--purple)) drop-shadow(0 0 14px rgba(157,80,224,.8))}
.bolt path{fill:none;stroke:var(--purple);stroke-width:2.5;stroke-linejoin:round}
.bolt.flicker{animation:boltFlick 3.2s infinite}
.bolt.flicker.b2{animation-delay:1.1s;animation-duration:4.1s}
@keyframes boltFlick{0%,86%,91%,96%{opacity:0}88%,93%,100%{opacity:1}89%,94%{opacity:.25}}
.rank-hud{overflow:visible}
#rankup .ru-bolt{position:absolute;filter:drop-shadow(0 0 10px var(--purple)) drop-shadow(0 0 30px var(--acc))}
#rankup .ru-bolt path{fill:none;stroke:#cfa6ff;stroke-width:4;stroke-linejoin:round}
#rankup.show .ru-bolt{animation:ruBolt .8s ease-out both}
@keyframes ruBolt{0%{opacity:0;transform:scaleY(.2);transform-origin:top}12%{opacity:1;transform:scaleY(1)}
  20%{opacity:.3}28%{opacity:1}60%{opacity:.8}100%{opacity:0}}
#rankup .ru-quote{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.95rem;color:var(--purple);
  margin-top:14px;letter-spacing:1.5px;text-shadow:0 0 10px rgba(157,80,224,.8);font-style:italic}
.shadow-soldier{position:absolute;bottom:0;right:6px;font-size:2.4rem;opacity:.18;pointer-events:none;
  filter:drop-shadow(0 0 8px var(--acc));animation:soldierFloat 5s ease-in-out infinite}
@keyframes soldierFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.sl-eyes{display:inline-block;animation:eyesGlow 2.5s ease-in-out infinite}
@keyframes eyesGlow{0%,100%{filter:drop-shadow(0 0 2px var(--blue))}50%{filter:drop-shadow(0 0 9px var(--blue)) drop-shadow(0 0 16px var(--acc2))}}
/* [AJOUT] ===== Fond plein écran : Monarque des Ombres ===== */
#bgart{position:fixed;inset:0;z-index:-2;pointer-events:none;background-repeat:no-repeat;
  background-position:center 78%;background-size:min(100vw,520px) auto;
  animation:bgBreath 8s ease-in-out infinite;filter:drop-shadow(0 0 50px rgba(123,47,190,.5))}
#bgart.custom{background-size:cover;background-position:center 20%;opacity:.6;animation:none;filter:none}
#bgveil{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,10,15,.78) 0%,rgba(10,10,15,.42) 30%,rgba(10,10,15,.36) 60%,rgba(10,10,15,.8) 100%)}
@keyframes bgBreath{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:.95;transform:scale(1.02)}}
/* cartes translucides pour laisser vivre le fond */
.card{background:rgba(15,15,26,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.hero{background:linear-gradient(135deg,rgba(22,22,46,.68),rgba(15,15,26,.6));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.rank-hud{background:linear-gradient(135deg,rgba(123,47,190,.18),rgba(0,212,255,.05)),rgba(15,15,26,.8);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
/* particules d'ombre flottantes */
.mote{position:fixed;bottom:-12px;border-radius:50%;background:var(--purple);pointer-events:none;z-index:-1;
  box-shadow:0 0 8px var(--acc2),0 0 16px rgba(157,80,224,.6);animation:moteRise linear infinite;opacity:0}
@keyframes moteRise{0%{transform:translateY(0);opacity:0}10%{opacity:.7}90%{opacity:.4}100%{transform:translateY(-105vh);opacity:0}}
/* [AJOUT] ===== Rank-up v2 : onde de choc, étincelles, secousse ===== */
.ru-wave{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;border:3px solid var(--blue);
  transform:translate(-50%,-50%);opacity:0;pointer-events:none}
#rankup.show .ru-wave{animation:ruWave 1.1s ease-out .15s 2}
@keyframes ruWave{0%{width:10px;height:10px;opacity:.9;border-color:#cfa6ff}
  100%{width:140vmax;height:140vmax;opacity:0;border-color:var(--blue)}}
.ru-spark{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:var(--purple);
  box-shadow:0 0 8px var(--acc2),0 0 18px var(--blue);opacity:0;pointer-events:none}
#rankup.show .ru-spark{animation:ruSpark 1.3s cubic-bezier(.1,.8,.3,1) both}
@keyframes ruSpark{0%{transform:translate(-50%,-50%);opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3);opacity:0}}
@keyframes ruShake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}
  60%{transform:translate(-4px,-3px)}80%{transform:translate(3px,4px)}}
body.shake #app{animation:ruShake .45s linear}
/* [AJOUT] ===== Thème MONARQUE (semaine de tests — boss fight) ===== */
body.monarch{--acc:#a01030;--acc2:#FF2D55;--purple:#ff7d92;--blue:#FF9F43}
body.monarch #bgveil{background:linear-gradient(180deg,rgba(20,4,8,.82) 0%,rgba(20,4,8,.5) 30%,rgba(15,4,8,.45) 60%,rgba(18,3,8,.85) 100%)}
body.monarch::before{background:radial-gradient(ellipse 60% 40% at 50% -5%,rgba(180,18,46,.3),transparent 70%),
  radial-gradient(ellipse 40% 30% at 85% 100%,rgba(255,159,67,.08),transparent 70%)}
body.monarch .rank-hud{border-color:rgba(255,45,85,.55);box-shadow:0 0 18px rgba(255,45,85,.3),inset 0 0 30px rgba(255,45,85,.08);
  background:linear-gradient(135deg,rgba(160,16,48,.2),rgba(255,159,67,.05)),rgba(20,8,14,.8)}
.boss-banner{font-family:'Rajdhani',sans-serif;text-align:center;border:1px solid rgba(255,45,85,.6);border-radius:12px;
  padding:12px;margin-bottom:12px;background:linear-gradient(135deg,rgba(120,8,30,.35),rgba(10,4,8,.6));
  box-shadow:0 0 18px rgba(255,45,85,.3);letter-spacing:2px}
.boss-banner b{font-size:1.15rem;color:#FF2D55;text-shadow:0 0 12px rgba(255,45,85,.9)}
/* [AJOUT] bouton échauffement + dernière perf */
.warm-btn{background:rgba(255,159,67,.12);border:1px solid rgba(255,159,67,.45);color:#FF9F43;
  border-radius:8px;padding:4px 9px;font-size:.72rem;font-weight:700;white-space:nowrap}
.lastperf{color:var(--blue);font-size:.72rem;margin-top:3px;opacity:.85}
/* [AJOUT] ===== MOTION DESIGN ===== */
/* entrée des cartes à chaque changement de vue (pas à chaque clic) */
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.985)}}
#app.enter>*{animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both}
#app.enter>*:nth-child(2){animation-delay:.05s} #app.enter>*:nth-child(3){animation-delay:.1s}
#app.enter>*:nth-child(4){animation-delay:.15s} #app.enter>*:nth-child(5){animation-delay:.2s}
#app.enter>*:nth-child(6){animation-delay:.25s} #app.enter>*:nth-child(7){animation-delay:.3s}
#app.enter>*:nth-child(n+8){animation-delay:.35s}
@keyframes fillIn{from{width:0}}
#app.enter .rank-fill,#app.enter .prog-fill{animation:fillIn 1.1s cubic-bezier(.2,.8,.2,1) both .15s}
/* reflet qui balaie les barres néon */
.prog-fill,.rank-fill{position:relative;overflow:hidden}
.prog-fill::after,.rank-fill::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-100%);
  animation:shimmer 2.8s ease-in-out infinite}
@keyframes shimmer{60%,100%{transform:translateX(100%)}}
/* scanner du HUD de rang */
.rank-hud .scan{position:absolute;inset:0;overflow:hidden;border-radius:10px;pointer-events:none}
.rank-hud .scan::after{content:'';position:absolute;top:0;bottom:0;width:35%;left:-40%;
  background:linear-gradient(90deg,transparent,rgba(0,212,255,.13),transparent);animation:scan 5s ease-in-out infinite}
@keyframes scan{0%{left:-40%}55%,100%{left:110%}}
/* retours tactiles */
.btn,.chip,.ck,nav button,.checkrow{transition:transform .14s ease,box-shadow .25s ease,background .25s ease,color .25s ease}
.btn:active,.chip:active,.ck:active,.checkrow:active{transform:scale(.95)}
.chip.on{animation:chipOn .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes chipOn{from{transform:scale(.85)}}
/* nav : indicateur lumineux + rebond de l'icône au changement d'onglet */
nav button{position:relative}
nav button.on::before{content:'';position:absolute;top:-6px;left:26%;right:26%;height:3px;border-radius:0 0 4px 4px;
  background:var(--acc2);box-shadow:0 0 10px var(--acc2),0 0 18px var(--acc2)}
nav button.on .ic{filter:drop-shadow(0 0 6px var(--acc2))}
nav button.just::before{animation:navLine .4s cubic-bezier(.2,.8,.2,1)}
nav button.just .ic{animation:navPop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes navLine{from{left:50%;right:50%;opacity:0}}
@keyframes navPop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-6px) scale(1.2)}100%{transform:none}}
/* validation de série */
@keyframes ckPop{0%{transform:scale(.6)}55%{transform:scale(1.18);box-shadow:0 0 0 7px rgba(0,255,136,.3)}
  100%{transform:scale(1);box-shadow:0 0 0 16px rgba(0,255,136,0)}}
.ck.pop{animation:ckPop .5s cubic-bezier(.2,1.4,.4,1)}
.ck.on{box-shadow:0 0 10px rgba(0,255,136,.45)}
.ex{transition:background .3s}
.ex.cleared .ex-name{color:var(--good);text-shadow:0 0 10px rgba(0,255,136,.35)}
.ex.cleared .ex-name::after{content:' ✓'}
/* barre de progression de séance (collante) */
.sess-prog{position:sticky;top:6px;z-index:20;background:rgba(15,15,26,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.78rem}
.sess-prog .prog-track{margin-top:7px}
.sess-prog .sess-fill{animation:grow .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:var(--from)}}
.sess-prog.full{border-color:var(--good);box-shadow:0 0 16px rgba(0,255,136,.3)}
.sess-prog.full .prog-fill{background:linear-gradient(90deg,#00b862,var(--good));box-shadow:0 0 12px var(--good)}
/* anneau de semaine */
.wring{flex-shrink:0}
.wring .bg{stroke:var(--bg3)}
.wring .fg{stroke:url(#wgrad);stroke-linecap:round;filter:drop-shadow(0 0 4px var(--acc2))}
#app.enter .wring .fg{animation:ringIn 1.3s cubic-bezier(.2,.8,.2,1) both .2s}
@keyframes ringIn{from{stroke-dashoffset:138.2}}
.wring text{fill:var(--txt);font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px}
.wring .wl{fill:var(--dim);font-size:7px;letter-spacing:1px;font-family:inherit}
.countdown{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.9rem;letter-spacing:.5px;color:var(--bad);
  background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.4);border-radius:99px;padding:4px 10px;
  animation:pulseRed 2.4s ease-in-out infinite}
@keyframes pulseRed{50%{box-shadow:0 0 12px rgba(255,77,109,.45)}}
/* modale en feuille + toast */
#modal{animation:fadeIn .25s ease}
#modal .box{animation:sheetUp .38s cubic-bezier(.2,.9,.25,1)}
@keyframes sheetUp{from{transform:translateY(60%);opacity:.4}}
@keyframes fadeIn{from{opacity:0}}
.toast{animation:toastIn .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes toastIn{from{transform:translate(-50%,-30px);opacity:0}}
/* fenêtre SYSTÈME « quête terminée » */
#quest{position:fixed;inset:0;z-index:260;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(3,5,14,.84);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#quest.show{display:flex;animation:fadeIn .3s ease}
.q-win{position:relative;width:100%;max-width:380px;border:1px solid rgba(0,212,255,.75);border-radius:6px;
  background:linear-gradient(180deg,rgba(0,45,80,.55),rgba(6,8,28,.94));padding:22px 20px 18px;text-align:center;overflow:hidden;
  box-shadow:0 0 26px rgba(0,212,255,.45),inset 0 0 34px rgba(0,212,255,.12);animation:qOpen .6s cubic-bezier(.2,1.1,.3,1) both}
.q-win::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,212,255,.05) 0 2px,transparent 2px 4px)}
@keyframes qOpen{0%{transform:scaleX(.5) scaleY(.02);opacity:0}45%{transform:scaleX(1) scaleY(.02);opacity:1}100%{transform:none}}
.q-head{font-family:'Rajdhani',sans-serif;letter-spacing:5px;color:var(--blue);font-size:.74rem;font-weight:700}
.q-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.45rem;letter-spacing:2px;color:#e8faff;margin-top:6px;
  text-shadow:0 0 14px var(--blue),0 0 30px rgba(0,212,255,.5)}
.q-sub{color:var(--dim);font-size:.76rem;margin-top:2px}
.q-lines{margin-top:16px;text-align:left}
.q-line{display:flex;justify-content:space-between;align-items:baseline;padding:9px 2px;border-bottom:1px solid rgba(0,212,255,.18);
  font-size:.86rem;color:#bfd8e6;animation:qLine .45s ease both}
.q-line:nth-child(1){animation-delay:.55s}.q-line:nth-child(2){animation-delay:.7s}
.q-line:nth-child(3){animation-delay:.85s}.q-line:nth-child(4){animation-delay:1s}
@keyframes qLine{from{opacity:0;transform:translateX(-14px)}}
.q-line b{font-family:'Rajdhani',sans-serif;font-size:1.15rem;color:#e8faff}
.q-line.rew b{color:var(--good);text-shadow:0 0 10px var(--good)}
.q-tap{margin-top:16px;font-size:.66rem;letter-spacing:2px;color:var(--dim);animation:blink 1.6s ease-in-out 1.3s infinite both}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.q-spark{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue);
  left:50%;top:50%;animation:qSpark 1.1s ease-out both}
@keyframes qSpark{from{transform:translate(-50%,-50%);opacity:1}to{transform:translate(var(--dx),var(--dy));opacity:0}}
/* coude + 1 bras */
.elbow-bars{display:flex;align-items:flex-end;gap:5px;height:70px;margin-top:10px}
.elbow-bars i{flex:1;max-width:30px;border-radius:4px 4px 0 0;min-height:4px;animation:barUp .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes barUp{from{transform:scaleY(0);transform-origin:bottom}}
.oap-row{display:grid;grid-template-columns:1fr 1fr 70px 46px;gap:6px;margin-top:10px}
.oap-row select,.oap-row input{padding:8px 6px;text-align:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;
  animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<!-- [AJOUT] fond plein écran (silhouette Jinwoo par défaut, image perso importable dans Profil) -->

<script>
'use strict';
/* ================================================================
   STREETLIFTING TRACKER — Bloc 6 semaines · SQ / TR / DI ×3 par semaine
   + traction 1 bras · affûtage et tests 1RM en S6.
   Toutes les charges sont recalculées depuis tes 1RM (load système
   réel = poids de corps + lest pour dips/tractions/muscle-up).
   Données 100% locales (localStorage). Export/import JSON dans Profil.
   ================================================================ */

const LIFTS = { // [AJOUT] couleurs recalées sur la palette Solo Leveling
  squat:{label:'Squat',       short:'SQ', type:'bar', color:'#9D50E0'},
  dl:   {label:'Deadlift',    short:'DL', type:'bar', color:'#00D4FF'},
  dips: {label:'Dips',        short:'DI', type:'w',   color:'#00ff88'},
  pull: {label:'Tractions',   short:'TR', type:'w',   color:'#FFD166'},
  mu:   {label:'Muscle-up',   short:'MU', type:'w',   color:'#FF4D6D'},
};
const DEFAULTS = {bw:68, rms:{squat:170, dl:185, dips:65, pull:50, mu:2.5},
  startDate:null, bwTarget:66, restHeavy:180, restAcc:90, sound:true, vibrate:true,
  // [AJOUT] seuils de rang (kg, total compé SQ+TR+DI+MU en LEST SEUL, hors poids de corps) — modifiables dans Profil
  rankMinsV:2,
  rankMins:{E:120, D:170, C:217.5, B:265, A:310, S:355, SS:397.5, SSS:440}};
const NW = 6; // durée du bloc — S6 = affûtage + tests
const BLOCK_LIFTS = ['squat','pull','dips']; // lifts travaillés sur ce bloc (DL et MU en pause)
// Cibles S6 (gain bas / haut, en kg) — la perte de 2 kg de PDC ajoute ~2 kg de lest à force égale
const TARGETS = {squat:[7.5,12.5], dips:[2.5,7.5], pull:[2.5,5]};

const DAY_NAMES = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const BLOCKS = [
  {weeks:[1,2], name:'Accumulation',      rpe:'RPE 7→8',  vol:'Volume élevé',   int:'70–87%'},
  {weeks:[3,4], name:'Intensification',   rpe:'RPE 8→9',  vol:'Volume moyen',   int:'77–92%'},
  {weeks:[5],   name:'Réalisation',       rpe:'RPE 9',    vol:'Volume minimal', int:'80–95%'},
  {weeks:[6],   name:'Affûtage & Tests',  rpe:'RPE max',  vol:'Tests 1RM',      int:'100%+'},
];

/* ---- définition du programme ----
   load: {pct:[semA,semB], lift} → % du 1RM (système pour lests)
         {txt:'...'} texte libre · {rpe:1} charge au RPE · {kg:[a,b]} kg fixes · null
   heavy:true → repos long après les séries
   Semaine type : chaque lift 3×/sem en ondulation LOURD / VOLUME / LÉGER-VITESSE.
     Lun SQ lourd + DI vitesse · Mar TR lourd + 1 bras force · Mer DI lourd + SQ pause
     Jeu 1 bras iso/excentrique + TR volume · Ven SQ volume · Sam DI volume + TR vitesse
   Coude (épitrochlée) : tirage jamais 2 jours de suite, prise pronation sur les lestées,
   isométrie fléchisseurs du poignet avant chaque séance de tirage. */
const T=(name,sets,reps,load,rpe,note,heavy)=>({name,sets,reps,load,rpe,note,heavy:!!heavy});

const ELBOW_ISO=T('Isométrie fléchisseurs poignet',4,'30s',{txt:'haltère, avant-bras posé'},null,'Prépa coude AVANT de tirer : poignet neutre, tiens fort sans bouger. Effet antalgique sur l’épitrochlée.');
const BLOCK_DAYS = {
  b1:{ // S1–S2 Accumulation
    intro:"Accumulation — volume élevé, RPE 7→8. S2 = S1 + un cran d'intensité. Genouillères SBD sur toutes les séries de squat de travail dès S1, ceinture sur les séries ≥ 80 %. Traction 1 bras : on construit le volume en assistance, jamais à l'échec.",
    days:[
      {focus:'Squat LOURD + Dips vitesse', ex:[
        T('Squat · top set',1,4,{pct:[80,82.5],lift:'squat'},8,'Série lourde du jour. Profondeur parallèle (hanche sous le genou), genoux dans l’axe.',1),
        T('Squat · back-off',3,5,{pct:[72,74],lift:'squat'},7,'Même setup, remontée agressive.',1),
        T('Dips vitesse',4,3,{pct:[65,67],lift:'dips'},6,'Concentrique EXPLOSIF, descente contrôlée 2 s. Zéro fatigue.'),
        T('Fentes bulgares',3,8,{rpe:1},7,'Par jambe. Haltères.'),
        T('Ab wheel',3,8,null,null,'Bassin en rétroversion, pas de cambrure.')]},
      {focus:'Tractions LOURDES + 1 bras force', ex:[
        ELBOW_ISO,
        T('Tractions lestées · top set',1,3,{pct:[85,87],lift:'pull'},8,'Prise pronation, menton au-dessus de la barre, bras tendus en bas.',1),
        T('Tractions lestées · back-off',3,4,{pct:[77,79],lift:'pull'},7,'Tempo 2-0-1, omoplates engagées avant de tirer.',1),
        T('Traction 1 bras assistée',5,'2/bras',{txt:'élastique ~20 kg'},7,'5 min après les lestées. Kg = assistance de l’élastique. Bras alterné, 90 s entre chaque bras. Arrête-toi à 2 reps de l’échec.'),
        T('Rowing haltère',3,8,{rpe:1},7,'Par bras, buste à plat.'),
        T('Curl marteau',3,10,{rpe:1},7,'Prise neutre = brachial/brachio-radial sans charger l’épitrochlée.')]},
      {focus:'Dips LOURDS + Squat pause', ex:[
        T('Dips lestés · top set',1,3,{pct:[86,88],lift:'dips'},8,'Épaule sous le coude en bas, verrouillage complet.',1),
        T('Dips lestés · back-off',3,5,{pct:[76,78],lift:'dips'},7,'Descente 2 s, pas de rebond.',1),
        T('Pause squat (3 s)',3,3,{pct:[65,67.5],lift:'squat'},7,'3 s immobile en bas, gainage maintenu, remontée explosive.',1),
        T('Développé militaire',3,8,{rpe:1},7,'Barre debout, fessiers serrés.'),
        T('Extension triceps poulie',3,12,{rpe:1},7,''),
        T('Élévations latérales',3,15,{rpe:1},7,'')]},
      {focus:'1 bras iso/excentrique + Tractions volume', ex:[
        ELBOW_ISO,
        T('Lock-off 1 bras (90°)',4,'10s/bras',null,null,'Coude à 90°, menton à hauteur de la main. Si tu tiens 10 s facilement → assistance doigt de l’autre main retirée / angle plus ouvert (120°).'),
        T('Négative 1 bras',3,'1/bras',null,null,'5 s de descente contrôlée de haut en bas. Arrête dès que la vitesse t’échappe. Gêne coude > 3/10 → remplace par lock-off.'),
        T('Tractions volume',4,5,{pct:[72,75],lift:'pull'},7,'Charge modérée, amplitude totale, scapula d’abord.'),

      {focus:'Squat VOLUME + jambes', ex:[
        T('Squat volume',4,6,{pct:[70,72.5],lift:'squat'},7.5,'Volume de base de la force. Reps régulières.',1),
        T('Leg curl',3,10,{rpe:1},7,''),
        T('Leg extension',3,12,{rpe:1},7,'Contrôle, utile pour le tendon rotulien.'),
        T('Hip thrust',3,8,{rpe:1},7,''),
        T('Hollow hold',3,'30s',null,null,'')]},
      {focus:'Dips VOLUME + Tractions vitesse', ex:[
        T('Dips volume',4,6,{pct:[72,74],lift:'dips'},7.5,'Amplitude complète.',1),
        T('Tractions vitesse',4,3,{pct:[62,64],lift:'pull'},6,'Tirage le plus rapide possible. Aucune rep lente.'),
        T('Face pull',3,15,{txt:'poulie / élastique'},7,'Santé coiffe des rotateurs.'),
        T('Rotation externe épaule',2,15,{txt:'élastique'},null,'Prévention épaule pour les dips lourds.'),
        T('L-sit',3,'15s',null,null,'')]},
    ]},
  b2:{ // S3–S4 Intensification
    intro:"Intensification — volume réduit, charges hautes, RPE 8→9. Top sets en doubles lourds. 1 bras : assistance réduite (~15 kg), reps de qualité. Coude : si la gêne monte, coupe d'abord les négatives, jamais les lestées.",
    days:[
      {focus:'Squat LOURD + Dips vitesse', ex:[
        T('Squat · top set',1,2,{pct:[88,90.5],lift:'squat'},8.5,'Double lourd. Bracing maximal, même setup que le test.',1),
        T('Squat · back-off',3,3,{pct:[80,82.5],lift:'squat'},8,'',1),
        T('Dips vitesse',4,2,{pct:[68,70],lift:'dips'},6,'Explosif.'),
        T('Fentes bulgares',3,6,{rpe:1},8,'Par jambe.'),
        T('Ab wheel',3,8,null,null,'')]},
      {focus:'Tractions LOURDES + 1 bras force', ex:[
        ELBOW_ISO,
        T('Tractions lestées · top set',1,2,{pct:[90,92],lift:'pull'},8.5,'Double lourd.',1),
        T('Tractions lestées · back-off',3,3,{pct:[83,85],lift:'pull'},8,'',1),
        T('Traction 1 bras assistée',5,'2/bras',{txt:'élastique ~15 kg'},8,'S3 : 5×2/bras. S4 : 4×2 puis 1 single/bras avec ~10 kg si RPE ≤ 8.'),
        T('Rowing haltère',3,8,{rpe:1},8,''),
        T('Curl marteau',3,8,{rpe:1},8,'')]},
      {focus:'Dips LOURDS + Squat pause', ex:[
        T('Dips lestés · top set',1,2,{pct:[90,92],lift:'dips'},8.5,'Double lourd.',1),
        T('Dips lestés · back-off',3,3,{pct:[82,84],lift:'dips'},8,'',1),
        T('Pause squat (3 s)',3,2,{pct:[70,72.5],lift:'squat'},7,'Contrôle du trou, vitesse en sortie.',1),
        T('Développé militaire',3,6,{rpe:1},8,''),
        T('Extension triceps poulie',3,10,{rpe:1},8,'')]},
      {focus:'1 bras iso/excentrique + Tractions volume', ex:[
        ELBOW_ISO,
        T('Lock-off 1 bras (120°)',4,'8s/bras',null,null,'Angle plus ouvert = zone faible de la traction 1 bras. Tiens sans tourner le buste.'),

        T('Tractions volume',4,4,{pct:[76,78],lift:'pull'},7.5,''),
        T('Tirage horizontal poulie (neutre)',3,10,{rpe:1},8,''),
        T('Curl poignet excentrique',3,15,{kg:[10,10]},null,'4 s de descente.'),
        T('Pronation au marteau',2,12,null,null,'')]},
      {focus:'Squat VOLUME + jambes', ex:[
        T('Squat volume',4,4,{pct:[77.5,80],lift:'squat'},8,'',1),
        T('Leg curl',3,10,{rpe:1},8,''),
        T('Leg extension',3,12,{rpe:1},8,''),
        T('Hollow hold',3,'30s',null,null,'')]},
      {focus:'Dips VOLUME + Tractions vitesse', ex:[
        T('Dips volume',4,4,{pct:[78,80],lift:'dips'},8,'',1),
        T('Tractions vitesse',4,2,{pct:[65,67],lift:'pull'},6,'Vitesse max.'),
        T('Face pull',3,15,{txt:'poulie / élastique'},7,''),
        T('Rotation externe épaule',2,15,{txt:'élastique'},null,''),
        T('L-sit',3,'15s',null,null,'')]},
    ]},
  b3:{ // S5 Réalisation
    intro:"Réalisation — singles lourds, volume minimal, RPE 9. Chaque top single = répétition générale du test : même échauffement, même setup, genouillères + ceinture. Accessoires réduits de moitié. Arrête le déficit calorique cette semaine.",
    days:[
      {focus:'Squat LOURD + Dips vitesse', ex:[
        T('Squat · top single',1,1,{pct:[93,93],lift:'squat'},9,'Single de compétition. Note la vitesse : c’est ton repère pour l’ouverture.',1),
        T('Squat · back-off',2,2,{pct:[85,85],lift:'squat'},8,'',1),
        T('Dips vitesse',3,2,{pct:[67,67],lift:'dips'},6,'')]},
      {focus:'Tractions LOURDES + 1 bras force', ex:[
        ELBOW_ISO,
        T('Tractions lestées · top single',1,1,{pct:[95,95],lift:'pull'},9,'Single quasi-max.',1),
        T('Tractions lestées · back-off',2,2,{pct:[87,87],lift:'pull'},8,'',1),
        T('Traction 1 bras assistée · singles',4,'1/bras',{txt:'élastique ~10 kg'},8.5,'3 min entre chaque bras. Qualité parfaite.')]},
      {focus:'Dips LOURDS + Squat léger', ex:[
        T('Dips lestés · top single',1,1,{pct:[95,95],lift:'dips'},9,'Single quasi-max.',1),
        T('Dips lestés · back-off',2,2,{pct:[87,87],lift:'dips'},8,'',1),
        T('Squat léger',3,2,{pct:[70,70],lift:'squat'},6,'Sans pause. Vitesse.'),
        T('Extension triceps poulie',2,10,{rpe:1},7,'')]},
      {focus:'1 bras isométrie + Tractions volume', ex:[
        ELBOW_ISO,
        T('Lock-off 1 bras (90° + 120°)',3,'8s/bras',null,null,'Pas de négatives cette semaine : on garde le coude frais pour les tests.'),
        T('Tractions volume',3,3,{pct:[80,80],lift:'pull'},8,''),
        T('Tirage horizontal poulie (neutre)',2,10,{rpe:1},7,'')]},
      {focus:'Squat VOLUME (réduit)', ex:[
        T('Squat volume',3,3,{pct:[80,80],lift:'squat'},7.5,'',1),
        T('Leg curl',2,10,{rpe:1},7,''),
        T('Hollow hold',2,'30s',null,null,'')]},
      {focus:'Dips VOLUME (réduit) + Tractions vitesse', ex:[
        T('Dips volume',3,3,{pct:[82,82],lift:'dips'},8,'',1),
        T('Tractions vitesse',3,2,{pct:[65,65],lift:'pull'},6,''),
        T('Face pull',2,15,{txt:'poulie / élastique'},null,'')]},
    ]},
};
// S6 — affûtage + tests, dans l'ordre des séances : {day} séance de rappel · {lift} test 1RM · {lift:null} repos
const TEST_WEEK = [
  {day:{focus:'Rappel Squat + Dips', ex:[
    T('Squat · rappel',1,1,{pct:[90,90],lift:'squat'},7,'Doit sortir VITE. Genouillères + ceinture comme au test.',1),
    T('Squat · back-off',2,2,{pct:[75,75],lift:'squat'},6,'',1),
    T('Dips · rappel',2,2,{pct:[80,80],lift:'dips'},6,'Vitesse, pas de fatigue.')]}},
  {day:{focus:'Rappel Tractions + test 1 bras', ex:[
    ELBOW_ISO,
    T('Tractions · rappel',1,1,{pct:[88,88],lift:'pull'},7,'',1),
    T('Tractions · back-off',2,2,{pct:[75,75],lift:'pull'},6,''),
    T('TEST traction 1 bras',3,'1/bras',{txt:'élastique le + léger possible'},9,'Descends d’élastique à chaque essai réussi. Note l’assistance (kg) de la meilleure rep propre de chaque bras. Max 3 essais/bras.')]}},
  {lift:null, note:'REPOS — mobilité légère hanches/épaules, marche. Mange à maintenance, dors 8 h.'},
  {lift:'squat', note:'Échauffe longuement hanches/chevilles. Genouillères SBD + ceinture.'},
  {lift:'pull',  note:'Grip frais, magnésie. Coude chaud : isométrie poignet avant l’échauffement.'},
  {lift:'dips',  note:'Dernier test : vide le réservoir.'},
];
const ATTEMPT_PCTS = [91,97,103];
BLOCK_DAYS.b4={intro:"Affûtage — volume coupé, intensité gardée. Les rappels doivent sortir vite et facilement. Calories à maintenance toute la semaine.", days:TEST_WEEK.map(t=>t.day||null)};

/* ================== ÉTAT ================== */
const KEY='sl_app_v1';

      else d.settings.rankMins={...DEFAULTS.rankMins,...savedMins};
      d.logs=d.logs||[]; d.mu=d.mu||{}; d.oap=d.oap||{}; d.oapLog=d.oapLog||[]; d.weights=d.weights||{}; d.daily=d.daily||{}; d.restDays=d.restDays||{};

/* ================== [AJOUT] RANG SOLO LEVELING + STREAK ================== */
// Critère : total des 1RM des 4 mouvements de COMPÉTITION streetlifting, en LEST SEUL
// (squat barre + lest tractions + lest dips + lest muscle-up). PAS de poids de corps ajouté.
// Le deadlift ne compte pas. Seuils modifiables dans Profil → S.settings.rankMins.
const COMP_LIFTS=['squat','pull','dips','mu'];
const RANKS=[
  {r:'E',  color:'#9aa0c0', s:'Novice Passionné'},
  {r:'D',  color:'#00ff88', s:'Pratiquant Intermédiaire'},
  {r:'C',  color:'#00D4FF', s:'Athlète Confirmé'},
  {r:'B',  color:'#9D50E0', s:'National / Avancé'},
  {r:'A',  color:'#FF4D6D', s:'Élite National'},
  {r:'S',  color:'#FFD166', s:'Niveau International'},
  {r:'SS', color:'#FFB13D', s:'Podium Mondial'},
  {r:'SSS',color:'#FFD700', s:'Légende / Recordman'},
];
const rankMin=i=>+S.settings.rankMins[RANKS[i].r]||0;
// total compé = somme brute des 1RM (squat barre + lests), sans poids de corps
function systemTotal(){ return COMP_LIFTS.reduce((a,k)=>a+(+S.settings.rms[k]||0),0); }
function rankIdxOf(total){ let i=0; RANKS.forEach((rk,j)=>{ if(total>=rankMin(j)) i=j; }); return i; }
function rankInfo(){
  const total=systemTotal(), i=rankIdxOf(total), cur=RANKS[i], next=RANKS[i+1]||null;
  const span=next?(rankMin(i+1)-rankMin(i)):0;
  const pct = next&&span>0 ? Math.min(100,Math.max(0,(total-rankMin(i))/span*100)) : 100;
  return {total,cur,next,nextMin:next?rankMin(i+1):null,pct};
}
function checkRankUp(){
  const i=rankIdxOf(systemTotal());
  if(S.rankIdx===undefined||S.rankIdx===null){ S.rankIdx=i; localStorage.setItem(KEY,JSON.stringify(S)); return; }
  if(i===S.rankIdx) return;
  const up=i>S.rankIdx;
  S.rankIdx=i; localStorage.setItem(KEY,JSON.stringify(S)); // écriture directe : pas de récursion via save()
  if(up) showRankUp(RANKS[i]);
}

// [AJOUT] arpège « notification du Système » (WebAudio, respecte le réglage Son)
function systemChime(){ try{ const ctx=new (window.AudioContext||window.webkitAudioContext)();
  [[392,0],[523,.12],[659,.24],[784,.36],[1046,.5]].forEach(([f,t])=>{
    const o=ctx.createOscillator(),g=ctx.createGain(); o.type='sine';
    o.connect(g); g.connect(ctx.destination); o.frequency.value=f;
    g.gain.setValueAtTime(.0001,ctx.currentTime+t);
    g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+t+.03);
    g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+t+.5);
    o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.55); }); }catch(e){} }
// Streak : jours consécutifs avec au moins une séance loggée.
// Le jour de repos CHOISI de chaque semaine ne casse pas la série ; aujourd'hui non plus tant que la journée n'est pas finie.
function calcStreak(){
  const dates=new Set(S.logs.map(l=>l.date));
  let streak=0; const d=new Date();
  if(dates.has(d.toISOString().slice(0,10))) streak++;
  d.setDate(d.getDate()-1);
  for(let i=0;i<730;i++){
    if(!isRestDate(d)){ // [AJOUT] repos flexible : on saute le jour de repos de cette semaine-là
      if(dates.has(d.toISOString().slice(0,10))) streak++;
      else break;
    }
    d.setDate(d.getDate()-1);
  }
  return streak;
}

/* ================== CALCULS ================== */
const r=(v,step)=>Math.round(v/step)*step;
const fmt=v=>(Math.round(v*100)/100).toLocaleString('fr-FR');
function sysRM(lift){ const t=LIFTS[lift].type, rm=S.settings.rms[lift];
  return t==='bar'? rm : S.settings.bw + rm; }
// charge prescrite pour un % donné → {kg: charge affichable, sys, assist:bool, label}
function calcLoad(lift,pct){
  const t=LIFTS[lift].type, sys=sysRM(lift)*pct/100;
  if(t==='bar'){ const kg=r(sys,2.5); return {kg, label:fmt(kg)+' kg'}; }
  const lest=r(sys - S.settings.bw, lift==='mu'?2.5:1.25);
  if(lest<=0) return {kg:0, assist:true, label:'PDC / assist. ~'+fmt(Math.abs(r(sys-S.settings.bw,1.25)))+' kg'};
  return {kg:lest, label:'+'+fmt(lest)+' kg'};
}
function exLoad(ex,wkIdx){ // wkIdx: 0|1 dans le bloc
  const L=ex.load;
  if(!L) return {label:'—'};
  if(L.txt) return {label:L.txt, txt:true};
  if(L.rpe) return {label:'charge au RPE '+ex.rpe, txt:true};
  if(L.kg)  return {kg:L.kg[wkIdx], label:fmt(L.kg[wkIdx])+' kg'};
  return calcLoad(L.lift, L.pct[wkIdx]);
}
// e1RM avec RPE : reps totales possibles = reps + (10 − RPE) ; Epley
function e1rm(w,reps,rpe){
  const tot = reps + Math.max(0, 10-(rpe||10));
  return tot<=1 ? w : w*(1+tot/30);
}
function weekOf(b){ return BLOCKS.find(x=>x.weeks.includes(Math.min(b,NW))); }
function blockKey(w){ return w<=2?'b1':w<=4?'b2':w<NW?'b3':'b4'; }
const WEEK_NUMS=Array.from({length:NW},(_,i)=>i+1);
// [AJOUT] nouveau cycle : baseline du bilan + on repart sans brouillons ni jours de repos de l'ancien cycle
function newCycle(date){ S.settings.startDate=date; S.cycleRef={date, bw:S.settings.bw, rms:{...S.settings.rms}};
  S._drafts={}; S.restDays={}; save(); }
function readiness(sleep,fat){ return Math.max(0,Math.min(10, Math.round(sleep*(6-fat)*0.3*10)/10)); }

function currentWeek(){
  const sd=S.settings.startDate; if(!sd) return 1;
  const diff=Math.floor((stripT(new Date())-stripT(new Date(sd)))/(864e5*7))+1;
  return Math.max(1,Math.min(8,diff)); // 8 = cycle terminé
}
function stripT(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(); }
function todayDow(){ return (new Date().getDay()+6)%7; } // 0=lundi
/* [AJOUT] ---- jour de repos FLEXIBLE : choisi par semaine (défaut dimanche) ---- */
function restDayOf(w){ const v=S.restDays[w]; return (v===undefined||v===null)?6:+v; }
function progDayIdx(w,d){ const rd=restDayOf(w); return d===rd ? null : (d<rd ? d : d-1); } // index dans les 6 séances du bloc
function setRestDay(w,d){ S.restDays[w]=d; save(); render();
  toast('😴 Repos de la S'+w+' placé le '+DAY_NAMES[d]); }
function weekFromDate(dt){ const sd=S.settings.startDate; if(!sd) return 0;
  return Math.floor((stripT(dt)-stripT(new Date(sd)))/(864e5*7))+1; }
function isRestDate(dt){ const w=weekFromDate(dt);
  if(w<1||w>NW) return dt.getDay()===0; // hors cycle : dimanche par défaut
  return ((dt.getDay()+6)%7)===restDayOf(w); }

/* ================== TIMER ================== */
const Timer={ left:0, total:0, run:false, _iv:null,
  start(sec){ this.left=sec; this.total=sec; this.run=true; this._tick();
    clearInterval(this._iv); this._iv=setInterval(()=>this._tick(),250);
    $('timerbar').style.display='flex'; this._last=Date.now(); },
  _tick(){ if(this.run){ const now=Date.now(); this.left-=(now-(this._last||now))/1000; this._last=now;
      if(this.left<=0){ this.left=0; this.done(); } }
    $('timer-t').textContent=Math.floor(this.left/60)+':'+String(Math.ceil(this.left%60)%60).padStart(2,'0');
    $('timer-p').textContent=this.run?'⏸':'▶'; },
  toggle(){ this.run=!this.run; this._last=Date.now(); },
  add(s){ this.left=Math.max(0,this.left+s); this._tick(); },
  stop(){ clearInterval(this._iv); $('timerbar').style.display='none'; this.run=false; },
  done(){ this.stop();
    if(S.settings.vibrate && navigator.vibrate) navigator.vibrate([200,100,200,100,400]);
    if(S.settings.sound){ try{ const ctx=new (window.AudioContext||window.webkitAudioContext)();
      [0,.25,.5].forEach((d,i)=>{ const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g); g.connect(ctx.destination); o.frequency.value=880+i*120;
        g.gain.setValueAtTime(.25,ctx.currentTime+d); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d+.2);
        o.start(ctx.currentTime+d); o.stop(ctx.currentTime+d+.22); }); }catch(e){} }
    toast('⏱️ Repos terminé — à toi !'); }
};

    <div class="chips" style="margin-bottom:0">
      ${WEEK_NUMS.map(i=>`<div class="chip ${i===w?'on':''}" onclick="view.week=${i};render()">S${i}</div>`).join('')}
    </div>
    <div class="chips" style="margin-bottom:0">
      ${DAY_NAMES.map((n,i)=>`<div class="chip ${i===d?'on':logFor(w,i)?'done':''}" onclick="view.day=${i};render()">${n.slice(0,3)}</div>`).join('')}
    </div></div>`;
  if(w===NW) head+=`<div class="boss-banner"><b>⚔️ BOSS FIGHT — SEMAINE DU MONARQUE</b>
    <div class="sub" style="margin-top:4px">« Montre au Système de quoi tu es capable. Chaque single est un boss. »</div></div>`;
  if(cw>NW && view.week===null)
    head+=`<div class="card" style="border-color:var(--good)"><b style="color:var(--good)">🎉 Cycle terminé !</b>
    <div class="muted" style="margin-top:4px">Reporte tes nouveaux 1RM dans Profil et change la date de début pour relancer un cycle. Si 2 tests sur 3 ont échoué, prends une semaine de deload complète d'abord.</div>
    <button class="btn small" style="margin-top:10px" onclick="progSub='bilan';go('prog')">🏁 Voir mon bilan de cycle</button></div>`;

}

function draftKey(w,d){ return `${w}-${d}`; }
function getDraft(w,d){ S._drafts=S._drafts||{}; return S._drafts[draftKey(w,d)]; }
function inCycle(l){ const sd=S.settings.startDate; return !sd || l.date>=sd; } // logs du cycle en cours uniquement
function logFor(w,d){ return S.logs.find(l=>l.week===w&&l.day===d&&inCycle(l)); }

function sessionHTML(w,d){
  // [AJOUT] repos flexible : le jour de repos de la semaine est celui que TU choisis (défaut dimanche)
  if(d===restDayOf(w)) return `<div class="card" style="text-align:center;padding:28px">
    <div style="font-size:2rem">😴</div><b>REPOS TOTAL</b>
    <div class="muted" style="margin-top:6px">La force se construit pendant la récupération. Mange, dors, marche.</div>
    ${dailyHTML()}
    <button class="btn ghost" style="margin-top:12px" onclick="if(confirm('Finalement t\\'entraîner aujourd\\'hui ? Le repos repassera au dimanche (tu pourras le redéplacer).')){setRestDay(${w},6)}">↺ Finalement je m'entraîne — repos remis au dimanche</button></div>`;
  const bk=blockKey(w), blk=BLOCK_DAYS[bk], wkIdx=(w-1)%2, day=blk.days[progDayIdx(w,d)];
  if(!day) return testDayHTML(d);
  const logged=logFor(w,d);
  const draft=ensureDraft(w,d,day,wkIdx);
  let h=`<div class="card tight"><div class="muted">${esc(blk.intro)}</div></div>`+sessProgHTML(w,d,day,draft);
  if(logged) h+=`<div class="card tight" style="border-color:var(--good)"><div class="row">
    <span class="badge good">✓ séance enregistrée</span><div class="grow"></div>
    <button class="btn small ghost" onclick="if(confirm('Refaire cette séance ? L\\'ancienne sera remplacée.')){delLog('${logged.id}');render()}">Refaire</button></div></div>`;
  h+=`<div class="card"><div class="row"><b>${esc(day.focus)}</b><div class="grow"></div>
      <span class="badge">${DAY_NAMES[d]}</span></div>`;
  day.ex.forEach((ex,xi)=>{ h+=exerciseHTML(ex,xi,wkIdx,draft,w,d); });
  h+=`</div>
  <button class="btn" onclick="openFinish(${w},${d})">✅ Terminer la séance</button>
  <button class="btn ghost" onclick="Timer.start(S.settings.restHeavy)">⏱️ Lancer un repos ${Math.round(S.settings.restHeavy/60*10)/10} min</button>
  <button class="btn ghost" onclick="if(confirm('Trop fatigué ? Placer ton jour de repos aujourd\\'hui (${DAY_NAMES[d]}) ? Les séances de la semaine se décalent automatiquement.')){setRestDay(${w},${d})}">😴 Je suis fatigué — repos aujourd'hui</button>`;
  return h;
}

function ensureDraft(w,d,day,wkIdx){
  S._drafts=S._drafts||{}; const k=draftKey(w,d);
  if(!S._drafts[k] || S._drafts[k].sig!==sig(day)){
    S._drafts[k]={sig:sig(day), ex:day.ex.map(ex=>{
      const L=exLoad(ex,wkIdx);
      const n=(typeof ex.sets==='number')?ex.sets:1;
      return {sets:Array.from({length:n},()=>({w:L.kg??'', reps:(typeof ex.reps==='number'?ex.reps:''), rpe:ex.rpe||'', done:false}))};
    })};
  }
  return S._drafts[k];
}
function sig(day){ return day.ex.map(e=>e.name+e.sets).join('|'); }

function exerciseHTML(ex,xi,wkIdx,draft,w,d){
  const L=exLoad(ex,wkIdx);
  const isNum=typeof ex.sets==='number';
  const plateBtn = (ex.load&&ex.load.lift&&LIFTS[ex.load.lift].type==='bar'&&L.kg)
    ? `<button class="btn small ghost" style="padding:4px 9px" onclick="plates(${L.kg})">🏋️</button>`:'';
  // [AJOUT] échauffement auto sur les top sets lourds calculés en %
  const warmBtn = (ex.heavy&&ex.load&&ex.load.lift&&ex.load.pct)
    ? `<button class="warm-btn" onclick="warmupModal('${ex.load.lift}',${ex.load.pct[wkIdx]})">🔥</button>`:'';
  let h=`<div class="ex${isNum&&draft.ex[xi].sets.every(s=>s.done)?' cleared':''}"><div class="row">
    <div class="grow"><span class="ex-name">${esc(ex.name)}</span>
      <span class="badge" style="margin-left:6px">${ex.sets}×${ex.reps}</span>
      ${ex.rpe?`<span class="badge blue" style="margin-left:4px">RPE ${ex.rpe}</span>`:''}</div>
    ${warmBtn}${plateBtn}<span class="ex-rx">${esc(L.label)}</span></div>`;
  if(ex.note) h+=`<div class="ex-note">${esc(ex.note)}</div>`;
  // [AJOUT] rappel de la dernière perf sur le même exercice
  const lp=lastPerf(ex.name,w,d);
  if(lp) h+=`<div class="lastperf">↩ Dernière fois (${lp.date.slice(5).replace('-','/')}) : ${lp.sets.map(s=>fmt(s.w)+' kg×'+s.reps+(s.rpe?' @'+s.rpe:'')).join(' · ')}</div>`;
  if(isNum){
    h+=`<div class="set-head"><span></span><span>kg</span><span>reps</span><span>rpe</span><span></span></div><div class="sets">`;
    draft.ex[xi].sets.forEach((st,si)=>{
      h+=`<div class="set"><span class="n">${si+1}</span>
      <input type="number" inputmode="decimal" step="0.5" value="${st.w}" placeholder="${L.kg??'—'}"
        onchange="setVal(${w},${d},${xi},${si},'w',this.value)">
      <input type="number" inputmode="numeric" value="${st.reps}" placeholder="${typeof ex.reps==='number'?ex.reps:'—'}"
        onchange="setVal(${w},${d},${xi},${si},'reps',this.value)">
      <input type="number" inputmode="decimal" step="0.5" value="${st.rpe}" placeholder="${ex.rpe||'—'}"
        onchange="setVal(${w},${d},${xi},${si},'rpe',this.value)">
      <button class="ck ${st.done?'on':''}${justCk===xi+'-'+si?' pop':''}" onclick="ckSet(${w},${d},${xi},${si},${ex.heavy?1:0})">✓</button></div>`;
    });
    h+=`</div>`;
  }
  return h+`</div>`;
}
function setVal(w,d,xi,si,f,v){ getDraft(w,d).ex[xi].sets[si][f]=v===''?'':+v; save(); }
function ckSet(w,d,xi,si,heavy){
  const st=getDraft(w,d).ex[xi].sets[si]; st.done=!st.done; save();
  if(st.done){ Timer.start(heavy?S.settings.restHeavy:S.settings.restAcc);
    justCk=xi+'-'+si; if(S.settings.vibrate&&navigator.vibrate) navigator.vibrate(15); }
  render(); justCk=null;
}
function plates(total){
  const bar=20, per=(total-bar)/2;
  if(per<0){ Modal.open(`<h2 style="margin-top:0">🏋️ ${fmt(total)} kg</h2><div class="muted">Sous le poids de la barre (20 kg).</div>`); return; }
  let rest=per, out=[];
  [25,20,15,10,5,2.5,1.25,0.5].forEach(p=>{ const n=Math.floor(rest/p+1e-9); if(n){ out.push(`${n} × ${fmt(p)} kg`); rest-=n*p; } });
  Modal.open(`<h2 style="margin-top:0">🏋️ ${fmt(total)} kg — barre 20 kg</h2>
  <div style="font-size:1.05rem;font-weight:700;margin:8px 0">${fmt(per)} kg par côté</div>
  <div class="muted">${out.join(' &nbsp;·&nbsp; ')||'barre vide'}${rest>0.01?` &nbsp;(reste ${fmt(rest)} kg)`:''}</div>
  <button class="btn ghost" onclick="Modal.close()">Fermer</button>`);
}

/* [AJOUT] ---- dernière perf sur le même exercice (hors séance affichée) ---- */
function lastPerf(name,w,d){
  const logs=[...S.logs].sort((a,b)=>b.date.localeCompare(a.date));
  for(const l of logs){ if(l.week===w&&l.day===d) continue;
    const e=l.ex.find(x=>x.name===name); if(e&&e.sets.length) return {date:l.date,sets:e.sets}; }
  return null;
}

    onclick="this.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${i}</div>`).join('')}</div>

  <label>Notes (sensations, technique, douleurs…)</label><textarea id="f-notes" rows="2"></textarea>

  <button class="btn ghost" onclick="Modal.close()">Annuler</button>`);

function finishSession(w,d){
  const sleep=+$('f-sleep').value||7;
  const fat=+(document.querySelector('#f-fat .chip.on')?.dataset.v||3);
  const notes=$('f-notes').value;
  const pi=progDayIdx(w,d); // [AJOUT] index de séance décalé par le jour de repos
  const day = BLOCK_DAYS[blockKey(w)].days[pi]; // null = journée de test
  const draft=getDraft(w,d)||{ex:[]};
  const names = !day ? ['Ouverture','2ᵉ essai','3ᵉ essai / PR'] : day.ex.map(e=>e.name);
  const liftOf = i => !day ? TEST_WEEK[pi].lift : (day.ex[i].load&&day.ex[i].load.lift)||null;
  const old=logFor(w,d); if(old) S.logs=S.logs.filter(l=>l!==old);
  const log={id:Date.now().toString(36), date:new Date().toISOString().slice(0,10), week:w, day:d,
    sleep, fatigue:fat, readiness:readiness(sleep,fat), notes, elbow:elbowVal(),
    ex:draft.ex.map((e,i)=>({name:names[i]||('Exo '+(i+1)), lift:liftOf(i),
      sets:e.sets.filter(s=>s.done&&s.w!==''&&s.reps!=='').map(s=>({w:+s.w,reps:+s.reps,rpe:s.rpe===''?null:+s.rpe}))}))
      .filter(e=>e.sets.length)};
  S.logs.push(log); save(); Modal.close(); showQuest(log);
  // détection PR (e1RM)
  const prs=detectPRs(log);
  if(prs.length){ render();
    Modal.open(`<h2 style="margin-top:0">🔥 Record estimé !</h2>${prs.map(p=>
      `<div class="card tight"><b>${LIFTS[p.lift].label}</b> — e1RM <b style="color:var(--acc2)">${fmt(p.val)} kg${LIFTS[p.lift].type==='w'?' (lest)':''}</b>
      <span class="muted"> (actuel : ${fmt(S.settings.rms[p.lift])} kg)</span>
      <button class="btn small" style="margin-top:8px" onclick="S.settings.rms['${p.lift}']=${p.val};save();this.textContent='✓ mis à jour';this.disabled=true">Mettre à jour mon 1RM</button></div>`).join('')}
    <button class="btn ghost" onclick="Modal.close();render()">Fermer</button>`);
  } else { toast('Séance enregistrée 💾'); render(); }
}
function detectPRs(log){
  const out=[];
  log.ex.forEach(e=>{ if(!e.lift) return;
    e.sets.forEach(s=>{
      const t=LIFTS[e.lift].type;
      const sysW = t==='bar'? s.w : S.settings.bw+s.w;
      const est = e1rm(sysW, s.reps, s.rpe);
      const estLift = t==='bar'? est : est-S.settings.bw;
      const rounded = r(estLift, 0.5);
      if(rounded > S.settings.rms[e.lift]+0.01){
        const ex=out.find(o=>o.lift===e.lift);
        if(!ex) out.push({lift:e.lift, val:rounded});
        else ex.val=Math.max(ex.val,rounded);
      }
    });
  });
  return out;
}
function delLog(id){ S.logs=S.logs.filter(l=>l.id!==id); save(); }

function refSysRM(k){ const ref=S.cycleRef; if(!ref||!ref.rms) return sysRM(k);
  return LIFTS[k].type==='bar'? ref.rms[k] : ref.bw + ref.rms[k]; }
function bestLiftRM(k){ // meilleur 1RM (lest/barre) atteint sur le cycle : max(1RM actuel, meilleur e1RM loggé)
  let best=S.settings.rms[k];
  S.logs.forEach(l=>l.ex.forEach(e=>{ if(e.lift!==k)return;
    e.sets.forEach(s=>{ const sysW=LIFTS[k].type==='bar'?s.w:S.settings.bw+s.w;
      const est=e1rm(sysW,s.reps,s.rpe); const estL=LIFTS[k].type==='bar'?est:est-S.settings.bw;
      if(estL>best)best=estL; });}));
  return r(best,0.5);
}
function cycleStats(){
  const ref=S.cycleRef||{bw:S.settings.bw,rms:{...S.settings.rms}};
  const per=BLOCK_LIFTS.map(k=>({k, init:ref.rms[k], best:bestLiftRM(k),
    delta:r(bestLiftRM(k)-ref.rms[k],0.5), tgt:TARGETS[k], comp:COMP_LIFTS.includes(k)}));
  const cl=S.logs.filter(inCycle), done=cl.length, planned=6*Math.max(1,Math.min(currentWeek(),NW));
  const avgReady=done? Math.round(cl.reduce((a,l)=>a+l.readiness,0)/done*10)/10 : 0;
  const totInit=COMP_LIFTS.reduce((a,k)=>a+(+ref.rms[k]||0),0); // lest seul, hors poids de corps
  const totNow=systemTotal();
  return {per,done,planned,avgReady,totInit,totNow,
    rankInit:RANKS[rankIdxOf(totInit)], rankNow:RANKS[rankIdxOf(totNow)], streak:calcStreak()};
}

function drawCharts(){
  const cwt=$('ch-weight'); if(cwt) drawWeight(cwt);
  // [AJOUT] total compé estimé séance par séance (running best e1RM par lift, base = baseline du cycle)
  const cr=$('ch-rank');
  if(cr){
    // cumul en LEST SEUL (estL) pour coller au total de rang (hors poids de corps)
    const refRms=(S.cycleRef&&S.cycleRef.rms)||S.settings.rms;
    const best={}; COMP_LIFTS.forEach(k=>best[k]=+refRms[k]||0);
    const pts=[{x:(S.cycleRef&&S.cycleRef.date)||'départ', y:r(COMP_LIFTS.reduce((a,k)=>a+best[k],0),0.5)}];
    [...S.logs].sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{
      let touched=false;
      l.ex.forEach(e=>{ if(!e.lift||!COMP_LIFTS.includes(e.lift))return;
        e.sets.forEach(s=>{ const sysW=LIFTS[e.lift].type==='bar'?s.w:S.settings.bw+s.w;
          const est=e1rm(sysW,s.reps,s.rpe); const estL=LIFTS[e.lift].type==='bar'?est:est-S.settings.bw;
          if(estL>best[e.lift]){best[e.lift]=estL; touched=true;} });});
      if(touched) pts.push({x:l.date, y:r(COMP_LIFTS.reduce((a,k)=>a+best[k],0),0.5)});
    });
    drawRankChart(cr,pts);
  }
  const c1=$('ch-e1rm');
  if(c1){
    const pts=[];
    [...S.logs].sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{
      let best=0;
      l.ex.forEach(e=>{ if(e.lift!==progLift)return;
        e.sets.forEach(s=>{ const sysW=LIFTS[progLift].type==='bar'?s.w:S.settings.bw+s.w;
          const est=e1rm(sysW,s.reps,s.rpe);
          const estL=LIFTS[progLift].type==='bar'?est:est-S.settings.bw;
          best=Math.max(best,estL); });});
      if(best>0) pts.push({x:l.date, y:r(best,0.5)});
    });
    drawLine(c1, pts, S.settings.rms[progLift], LIFTS[progLift].color);
  }
  const c2=$('ch-ready');
  if(c2){
    const pts=[...S.logs].sort((a,b)=>a.date.localeCompare(b.date)).map(l=>({x:l.date,y:l.readiness}));
    Object.keys(S.daily).sort().forEach(k=>pts.push({x:k,y:S.daily[k].r}));
    pts.sort((a,b)=>a.x.localeCompare(b.x));
    drawBars(c2, pts);
  }
  // [AJOUT] graphes top set : meilleure charge d'une série validée, par séance et par lift
  Object.keys(LIFTS).forEach(k=>{
    const cv=$('ch-top-'+k); if(!cv) return;
    const pts=[];
    [...S.logs].sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{
      let best=-Infinity;
      l.ex.forEach(e=>{ if(e.lift!==k)return; e.sets.forEach(s=>{ if(s.w>best)best=s.w; }); });
      if(best>-Infinity) pts.push({x:l.date, y:best});
    });
    drawLine(cv, pts, null, LIFTS[k].color);
  });
}
function drawLine(cv,pts,refLine,color){
  const x=cv.getContext('2d'), W=cv.width, H=cv.height, P=36;
  x.clearRect(0,0,W,H);
  x.font='20px sans-serif'; x.fillStyle='#6a6a92'; // [AJOUT] gris recalé palette SL
  if(!pts.length){ x.fillText('Pas encore de données — enregistre des séances !',P,H/2); return; }
  const ys=pts.map(p=>p.y).concat(refLine?[refLine]:[]);
  let lo=Math.min(...ys), hi=Math.max(...ys); const pad=(hi-lo)*0.15||5; lo-=pad; hi+=pad;
  const px=i=>P+(pts.length===1?(W-2*P)/2:i*(W-2*P)/(pts.length-1));
  const py=v=>H-P-(v-lo)/(hi-lo)*(H-2*P);
  // grid
  x.strokeStyle='#262645'; x.lineWidth=1;
  for(let g=0;g<=3;g++){ const v=lo+(hi-lo)*g/3; x.beginPath(); x.moveTo(P,py(v)); x.lineTo(W-10,py(v)); x.stroke();
    x.fillStyle='#6a6a92'; x.fillText(fmt(r(v,0.5)), 2, py(v)+6); }
  if(refLine){ x.setLineDash([8,6]); x.strokeStyle='#8888aa'; x.beginPath(); x.moveTo(P,py(refLine)); x.lineTo(W-10,py(refLine)); x.stroke(); x.setLineDash([]); }
  x.strokeStyle=color; x.lineWidth=3;
  x.shadowColor=color; x.shadowBlur=10; // [AJOUT] trait néon
  x.beginPath();
  pts.forEach((p,i)=>{ i?x.lineTo(px(i),py(p.y)):x.moveTo(px(0),py(p.y)); }); x.stroke();
  x.shadowBlur=0;
  pts.forEach((p,i)=>{ x.fillStyle=color; x.beginPath(); x.arc(px(i),py(p.y),6,0,7); x.fill();
    x.fillStyle='#e6edf3'; x.font='bold 18px Rajdhani,sans-serif';
    x.fillText(fmt(p.y), px(i)-18, py(p.y)-12); });
  x.fillStyle='#6a6a92'; x.font='16px sans-serif';
  x.fillText(pts[0].x.slice(5), P-10, H-8); if(pts.length>1) x.fillText(pts[pts.length-1].x.slice(5), W-70, H-8);
}
/* [AJOUT] graphe du total compé avec les seuils de rang en lignes colorées */
function drawRankChart(cv,pts){
  const x=cv.getContext('2d'), W=cv.width, H=cv.height, P=46;
  x.clearRect(0,0,W,H);
  x.font='20px sans-serif'; x.fillStyle='#6a6a92';
  if(!pts.length){ x.fillText('Pas encore de données.',P,H/2); return; }
  let lo=Math.min(...pts.map(p=>p.y)), hi=Math.max(...pts.map(p=>p.y));
  const pad=Math.max((hi-lo)*0.25,12); lo-=pad; hi+=pad;
  const px=i=>P+(pts.length===1?(W-2*P)/2:i*(W-2*P)/(pts.length-1));
  const py=v=>H-P-(v-lo)/(hi-lo)*(H-2*P);
  // seuils de rang visibles dans la fenêtre
  RANKS.forEach((rk,i)=>{ const m=rankMin(i); if(i===0||m<lo||m>hi) return;
    x.setLineDash([6,5]); x.strokeStyle=rk.color; x.globalAlpha=.6; x.lineWidth=1.5;
    x.beginPath(); x.moveTo(P,py(m)); x.lineTo(W-8,py(m)); x.stroke();
    x.setLineDash([]); x.globalAlpha=1;
    x.fillStyle=rk.color; x.font='bold 17px Rajdhani,sans-serif'; x.fillText(rk.r,6,py(m)+6);
    x.font='13px Rajdhani,sans-serif'; x.fillText(fmt(m),26,py(m)+6); });
  // courbe néon
  x.strokeStyle='#9D50E0'; x.lineWidth=3.5; x.shadowColor='#9D50E0'; x.shadowBlur=14;
  x.beginPath(); pts.forEach((p,i)=>{ i?x.lineTo(px(i),py(p.y)):x.moveTo(px(0),py(p.y)); }); x.stroke();
  x.shadowBlur=0;
  pts.forEach((p,i)=>{ x.fillStyle='#bc8cff'; x.beginPath(); x.arc(px(i),py(p.y),6,0,7); x.fill(); });
  const last=pts[pts.length-1];
  x.fillStyle='#e6edf3'; x.font='bold 20px Rajdhani,sans-serif';
  x.fillText(fmt(last.y)+' kg', Math.min(px(pts.length-1)-30,W-110), py(last.y)-14);
}
function drawBars(cv,pts){
  const x=cv.getContext('2d'), W=cv.width, H=cv.height, P=30;
  x.clearRect(0,0,W,H);
  x.font='20px sans-serif'; x.fillStyle='#6a6a92';
  if(!pts.length){ x.fillText('Pas encore de données.',P,H/2); return; }
  const n=pts.length, bw=Math.min(40,(W-2*P)/n*0.7);
  pts.forEach((p,i)=>{
    const cx=P+(i+0.5)*(W-2*P)/n, h=(p.y/10)*(H-2*P);
    x.fillStyle=p.y>=8?'#00ff88':p.y>=6?'#d29922':'#ff4d6d';
    x.fillRect(cx-bw/2, H-P-h, bw, h);
  });
  x.strokeStyle='#8888aa'; x.setLineDash([6,5]); x.beginPath();
  const y5=H-P-(5/10)*(H-2*P); x.moveTo(P,y5); x.lineTo(W-P,y5); x.stroke(); x.setLineDash([]);
  x.fillStyle='#6a6a92'; x.fillText('5 = seuil deload', W-190, y5-6);
}

const OAP_LADDER=[
  ['5×2/bras avec élastique ~20 kg, RPE ≤ 7','Base du bloc (S1–S2). Bassin et épaules face à la barre, sans vriller.'],
  ['Lock-off 90° tenu 10 s/bras sans aide','Force dans la position où la traction 1 bras se gagne.'],
  ['Négative 6 s/bras contrôlée jusqu’en bas','Vitesse constante sur toute l’amplitude, coude sans douleur.'],
  ['1 rep/bras avec élastique ~10 kg à RPE ≤ 8','Ton max actuel devient un travail sous-maximal (S4–S5).'],
  ['1 rep/bras avec élastique ~5 kg','Objectif du test S6.'],
  ['1ʳᵉ traction 1 bras stricte','Objectif du bloc suivant — à ne pas forcer dans ce bloc.'],
];
const OAP_WEEKS=[
  ['S1','5×2/bras · élastique ~20 kg','Lock-off 90° 4×10 s · négatives 3×1 (5 s)'],
  ['S2','5×2/bras · élastique ~20 kg (RPE 8)','Lock-off 90° 4×10 s · négatives 3×1 (5 s)'],
  ['S3','5×2/bras · élastique ~15 kg','Lock-off 120° 4×8 s · négatives 4×1 (6 s)'],

function oapHTML(){
  const bw=S.settings.bw;
  const bands=[20,15,10,5,0];
  return `<h1>💪 Traction 1 bras</h1>
  <div class="card" style="margin-top:10px;border-color:rgba(248,81,73,.5)">
    <b style="color:var(--bad)">PRINCIPE CLÉ</b>
    <div class="muted" style="margin-top:6px">Ton point de départ : 30 s de hold en haut sur chaque bras, 3 reps avec ~20 kg d'assistance et 1 rep avec ~10 kg.
    Ton hold est déjà solide : ce qui te limite, c'est la <b>force sur l'amplitude</b> (sortie bras tendu et passage 90°→120°).
    Le bloc travaille donc 2 qualités, à 2 jours d'écart : <b>la force en assistance</b> le mardi (reps complètes, jamais à l'échec) et
    <b>les angles faibles</b> le jeudi (lock-off, négatives). Le coude passe avant tout : 2 séances de tirage ne se suivent jamais.</div></div>
  ${oapRecordsHTML()}${elbowCardHTML()}
  <div class="card"><b>Progression semaine par semaine</b>
  <table style="margin-top:8px"><tr><th>Sem.</th><th>Mardi — force</th><th>Jeudi — angles</th></tr>
  ${OAP_WEEKS.map(w=>`<tr><td><b>${w[0]}</b></td><td>${w[1]}</td><td>${w[2]}</td></tr>`).join('')}
  </table>
  <div class="ex-note" style="margin-top:8px">Bras alternés, 90 s à 3 min entre chaque bras. Commence toujours par le bras le plus faible.</div></div>
  <div class="card"><b>Charge réelle selon l'élastique</b> <span class="sub">(PDC ${fmt(bw)} kg)</span>
  <table style="margin-top:8px"><tr><th>Assistance</th><th>Charge tirée</th><th>% PDC</th></tr>
  ${bands.map(a=>`<tr><td><b>${a?'~'+a+' kg':'aucune'}</b></td><td>${fmt(bw-a)} kg</td><td>${Math.round((bw-a)/bw*100)}%</td></tr>`).join('')}
  </table>
  <div class="ex-note" style="margin-top:8px">L'aide d'un élastique varie avec l'étirement (forte en bas, faible en haut). Ces kg sont des repères : garde le même élastique et le même point d'attache d'une semaine à l'autre. Perdre 2 kg = −3 % de charge sur la traction 1 bras : c'est gratuit.</div></div>
  <div class="card"><b>Technique</b>
  <div class="muted" style="margin-top:6px">• Prise neutre ou légèrement en supination, main dans l'axe de l'épaule.<br>
  • Départ bras tendu actif : abaisse l'omoplate AVANT de plier le coude.<br>
  • Jambes serrées et gainées devant (hollow léger) pour limiter la rotation.<br>
  • Le coude descend le long du corps, menton au-dessus de la main.<br>
  • Main libre posée sur la poitrine — jamais sur le bras qui tire.</div></div>
  <div class="card"><b>🩹 Protocole coude (épitrochlée)</b>
  <div class="muted" style="margin-top:6px">• Avant chaque séance de tirage : isométrie des fléchisseurs du poignet, 4×30 s (déjà dans tes séances).<br>
  • Jeudi : curl poignet excentrique 3×15 (4 s de descente) + pronation au marteau.<br>
  • Douleur ≤ 3/10 qui disparaît le lendemain = continue. Au-delà : enlève d'abord les négatives, puis augmente l'assistance de +5 kg.<br>
  • Douleur qui augmente d'une semaine à l'autre ou présente au repos → stop 1 bras et consulte un kiné.</div></div>
  <div class="card"><b>Échelle de progression</b>
  ${OAP_LADDER.map((s,i)=>`<div class="checkrow ${S.oap[i]?'on':''}" onclick="S.oap[${i}]=!S.oap[${i}];save();render()">
    <div class="box2">${S.oap[i]?'✓':''}</div>
    <div class="tx"><b>Étape ${i+1} — ${esc(s[0])}</b><div class="ex-note">${esc(s[1])}</div></div></div>`).join('')}
  </div>`;
}

function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='streetlifting-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}
function importData(inp){
  const f=inp.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result);
    if(!d.settings||!d.settings.rms) throw 0;
    localStorage.setItem(KEY,JSON.stringify(d)); S=load(); toast('Import réussi ✓'); render();
  }catch(e){ alert('Fichier invalide.'); } };
  rd.readAsText(f);
}
