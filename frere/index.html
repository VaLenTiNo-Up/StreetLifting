<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IronMode">
<title>IronMode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d12; --bg2:#131722; --bg3:#1b2030; --line:#252c3f;
  --txt:#eef1f7; --dim:#8b93a7; --faint:#5b6378;
  --acc:#ff6b2c; --acc2:#ffb03b; --good:#2ee59d; --blue:#4da3ff; --bad:#ff4d6d; --purple:#a78bfa;
  --grad:linear-gradient(135deg,#ff6b2c,#ffb03b);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{background:var(--bg);color:var(--txt);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));min-height:100vh;overscroll-behavior-y:contain;overflow-x:hidden}
body::before{content:'';position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 30% at 15% 0%,rgba(255,107,44,.16),transparent 70%),
             radial-gradient(35% 30% at 95% 20%,rgba(77,163,255,.10),transparent 70%),
             radial-gradient(40% 35% at 50% 110%,rgba(167,139,250,.10),transparent 70%);
  animation:glowDrift 18s ease-in-out infinite alternate}
@keyframes glowDrift{to{transform:translate(3%,2%) scale(1.06)}}
#app{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 0}
h1,h2,h3,.num{font-family:'Barlow Condensed',Inter,sans-serif;letter-spacing:.4px}
h1{font-size:1.9rem;font-weight:800;line-height:1.05}
h2{font-size:1.25rem;font-weight:700;margin:20px 0 10px}
h3{font-size:1.05rem;font-weight:700}
.sub{color:var(--dim);font-size:.8rem;margin-top:3px;line-height:1.4}
.muted{color:var(--dim);font-size:.84rem;line-height:1.5}
.card{background:rgba(19,23,34,.88);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card.tight{padding:12px 14px}
.card.hot{border-color:rgba(255,107,44,.45);box-shadow:0 0 0 1px rgba(255,107,44,.15),0 10px 30px rgba(255,107,44,.12)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{background:var(--bg3);border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:7px 13px;
  font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;user-select:none}
.chip.on{background:var(--grad);border-color:transparent;color:#1a0d05;font-weight:800;box-shadow:0 4px 14px rgba(255,107,44,.35)}
.chip.done{border-color:var(--good);color:var(--good)}
.badge{display:inline-block;font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg3);color:var(--dim)}
.badge.acc{background:rgba(255,107,44,.14);color:var(--acc2)}
.badge.good{background:rgba(46,229,157,.12);color:var(--good)}
.badge.blue{background:rgba(77,163,255,.14);color:var(--blue)}
.badge.bad{background:rgba(255,77,109,.14);color:var(--bad)}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
.btn{display:block;width:100%;background:var(--grad);color:#1a0d05;font-weight:800;border-radius:14px;padding:15px 16px;
  font-size:1rem;margin-top:10px;box-shadow:0 8px 24px rgba(255,107,44,.3);letter-spacing:.2px}
.btn.ghost{background:var(--bg3);color:var(--txt);border:1px solid var(--line);box-shadow:none;font-weight:700}
.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:.8rem;margin:0;border-radius:11px}
.btn.danger{background:rgba(255,77,109,.12);color:var(--bad);border:1px solid rgba(255,77,109,.35);box-shadow:none}
input,select,textarea{background:var(--bg3);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px;
  font-size:16px;font-family:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,107,44,.15)}
label{font-size:.76rem;color:var(--dim);font-weight:600;display:block;margin:12px 0 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;color:var(--faint);font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;padding:6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid rgba(37,44,63,.6);vertical-align:top}
tr:last-child td{border-bottom:none}
.stat{background:var(--bg3);border-radius:14px;padding:12px}
.stat .v{font-family:'Barlow Condensed',sans-serif;font-size:1.6rem;font-weight:800;line-height:1}
.stat .l{font-size:.66rem;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-top:5px}
.track{height:8px;background:var(--bg3);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--grad);position:relative;overflow:hidden;box-shadow:0 0 12px rgba(255,107,44,.5)}
.fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  transform:translateX(-100%);animation:shimmer 2.8s ease-in-out infinite}
@keyframes shimmer{60%,100%{transform:translateX(100%)}}
.hr{height:1px;background:var(--line);margin:12px 0}
/* ===== nav ===== */
nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;justify-content:space-around;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(11,13,18,.94);border-top:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
nav button{position:relative;background:none;color:var(--faint);font-size:.64rem;font-weight:700;display:flex;flex-direction:column;
  align-items:center;gap:3px;padding:4px 6px;flex:1;max-width:84px;transition:color .25s}
nav button .ic{font-size:1.3rem;transition:transform .3s}
nav button.on{color:var(--acc2)}
nav button.on::before{content:'';position:absolute;top:-9px;left:28%;right:28%;height:3px;border-radius:0 0 4px 4px;
  background:var(--grad);box-shadow:0 0 12px var(--acc)}
nav button.just .ic{animation:navPop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes navPop{40%{transform:translateY(-6px) scale(1.2)}}
body.onb nav{display:none}
/* ===== motion ===== */
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.98)}}
#app.enter>*{animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both}
#app.enter>*:nth-child(2){animation-delay:.05s}#app.enter>*:nth-child(3){animation-delay:.1s}
#app.enter>*:nth-child(4){animation-delay:.15s}#app.enter>*:nth-child(5){animation-delay:.2s}
#app.enter>*:nth-child(6){animation-delay:.25s}#app.enter>*:nth-child(n+7){animation-delay:.3s}
@keyframes fillIn{from{width:0}}
#app.enter .fill{animation:fillIn 1.1s cubic-bezier(.2,.8,.2,1) both .2s}
.btn,.chip,.ck,.tap{transition:transform .14s ease,box-shadow .25s,background .25s}
.btn:active,.chip:active,.ck:active,.tap:active{transform:scale(.95)}
@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
/* ===== home ===== */
.hello{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avatar{width:52px;height:52px;border-radius:16px;background:var(--grad);display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed';font-weight:800;font-size:1.5rem;color:#1a0d05;box-shadow:0 6px 20px rgba(255,107,44,.35);flex-shrink:0}
.lvl{font-family:'Barlow Condensed';font-weight:800;font-size:.85rem;letter-spacing:1px;color:var(--acc2)}
.streak{display:flex;align-items:center;gap:6px;font-family:'Barlow Condensed';font-weight:800;font-size:1.3rem;
  background:rgba(255,107,44,.12);border:1px solid rgba(255,107,44,.35);border-radius:14px;padding:6px 12px}
.streak .fl{display:inline-block;animation:flame 1.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flame{50%{transform:scale(1.15) rotate(-4deg)}}
.today{position:relative;overflow:hidden;border:none;background:linear-gradient(135deg,rgba(255,107,44,.95),rgba(255,176,59,.9));color:#1a0d05}
.today .sub,.today .muted{color:rgba(26,13,5,.75)}
.today::after{content:'';position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%);animation:breath 4s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.15);opacity:.7}}
.today .btn{background:#1a0d05;color:#ffd9b0;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.today.rest{background:linear-gradient(135deg,#1e2a45,#16203a);color:var(--txt)}
.today.rest .sub,.today.rest .muted{color:var(--dim)}
.today.done{background:linear-gradient(135deg,#15a36e,#2ee59d)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.wk div{text-align:center;padding:8px 0;border-radius:12px;background:var(--bg3);font-size:.68rem;color:var(--dim);font-weight:700;border:1px solid transparent}
.wk div b{display:block;font-size:1rem;margin-top:2px}
.wk .plan{border-color:var(--line);color:var(--txt)}
.wk .ok{background:rgba(46,229,157,.14);border-color:var(--good);color:var(--good)}
.wk .miss{background:rgba(255,77,109,.1);border-color:rgba(255,77,109,.4);color:var(--bad)}
.wk .now{box-shadow:0 0 0 2px var(--acc)}
.mission{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid rgba(37,44,63,.6);cursor:pointer}
.mission:first-of-type{border-top:none}
.mission .box{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-weight:900;color:#06150d;font-size:.85rem}
.mission.on .box{background:var(--good);border-color:var(--good);animation:pop .45s cubic-bezier(.2,1.5,.4,1);box-shadow:0 0 12px rgba(46,229,157,.5)}
.mission.on .tx{color:var(--dim);text-decoration:line-through}
.mission .xp{font-family:'Barlow Condensed';font-weight:800;color:var(--acc2);font-size:.9rem}
.mission.auto{cursor:default}
.quote{font-family:'Barlow Condensed';font-size:1.35rem;font-weight:700;line-height:1.2}
.ring text{font-family:'Barlow Condensed';font-weight:800;fill:var(--txt)}
#app.enter .ring .fg{animation:ringIn 1.4s cubic-bezier(.2,.8,.2,1) both .2s}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
/* ===== séance ===== */
.ex{border-top:1px solid var(--line);padding:14px 0}
.ex:first-child{border-top:none;padding-top:4px}
.ex-name{font-weight:800;font-size:1rem}
.ex.cleared .ex-name{color:var(--good)}
.ex.cleared .ex-name::after{content:' ✓'}
.ex-note{color:var(--dim);font-size:.76rem;margin-top:4px;line-height:1.4}
.target{margin-top:8px;font-size:.8rem;background:rgba(255,107,44,.08);border-left:3px solid var(--acc);border-radius:0 10px 10px 0;padding:8px 10px}
.target b{color:var(--acc2)}
.cues{margin-top:8px;font-size:.8rem;background:rgba(77,163,255,.07);border-left:3px solid var(--blue);border-radius:0 10px 10px 0;padding:8px 10px;line-height:1.55;animation:fadeIn .3s}
.sets{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.set,.set-head{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center}
.set-head{font-size:.62rem;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;text-align:center;margin-top:10px}
.set .n{color:var(--faint);font-weight:800;text-align:center;font-size:.8rem}
.set input{padding:10px 6px;text-align:center;font-size:16px;border-radius:11px}
.ck{width:48px;height:42px;border-radius:12px;background:var(--bg3);border:1px solid var(--line);color:var(--faint);font-weight:900;font-size:1.05rem}
.ck.on{background:var(--good);border-color:var(--good);color:#06150d;box-shadow:0 0 12px rgba(46,229,157,.45)}
.ck.pop{animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.sess-prog{position:sticky;top:calc(6px + env(safe-area-inset-top));z-index:20;background:rgba(19,23,34,.94);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.sess-prog .track{margin-top:7px}
.sess-prog .fill{transition:width .5s cubic-bezier(.2,.8,.2,1)}
.sess-prog.full{border-color:var(--good)}
.sess-prog.full .fill{background:linear-gradient(90deg,#15a36e,var(--good))}
.tag{display:inline-block;font-size:.64rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:7px}
/* ===== timer ===== */
#timer{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));z-index:49;display:none;justify-content:center;pointer-events:none}
#timer.show{display:flex;animation:up .35s cubic-bezier(.2,1.2,.4,1)}
#timer .in{pointer-events:auto;display:flex;align-items:center;gap:10px;background:rgba(27,32,48,.97);border:1px solid var(--acc);
  border-radius:99px;padding:7px 8px 7px 8px;box-shadow:0 10px 30px rgba(0,0,0,.5);margin:0 14px}
#timer .t{font-family:'Barlow Condensed';font-size:1.5rem;font-weight:800;min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
#timer button{width:38px;height:38px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);font-weight:800;font-size:.8rem}
/* ===== modal / overlays ===== */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:none;align-items:flex-end;justify-content:center;animation:fadeIn .25s}
#modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:sheet .38s cubic-bezier(.2,.9,.25,1)}
@keyframes sheet{from{transform:translateY(60%);opacity:.4}}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:300;background:var(--bg3);
  border:1px solid var(--acc);color:var(--txt);padding:11px 18px;border-radius:99px;font-size:.84rem;font-weight:700;
  box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;white-space:nowrap;animation:toastIn .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes toastIn{from{transform:translate(-50%,-30px);opacity:0}}
#celebrate{position:fixed;inset:0;z-index:250;display:none;align-items:center;justify-content:center;padding:24px;
  background:rgba(5,6,10,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#celebrate.show{display:flex;animation:fadeIn .3s}
.cel{width:100%;max-width:380px;text-align:center;background:linear-gradient(180deg,#1d2233,#121624);border:1px solid rgba(255,107,44,.5);
  border-radius:24px;padding:26px 20px 20px;box-shadow:0 0 40px rgba(255,107,44,.25);animation:celIn .6s cubic-bezier(.2,1.3,.3,1) both}
@keyframes celIn{from{transform:scale(.6) translateY(30px);opacity:0}}
.cel .big{font-size:4rem;line-height:1;animation:bounce 1.2s ease-in-out .4s infinite}
@keyframes bounce{50%{transform:translateY(-8px) scale(1.05)}}
.cel h1{margin-top:10px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cel .ln{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line);font-size:.88rem;animation:lnIn .4s ease both}
.cel .ln b{font-family:'Barlow Condensed';font-size:1.15rem}
.cel .ln:nth-child(1){animation-delay:.4s}.cel .ln:nth-child(2){animation-delay:.52s}.cel .ln:nth-child(3){animation-delay:.64s}
.cel .ln:nth-child(4){animation-delay:.76s}.cel .ln:nth-child(5){animation-delay:.88s}
@keyframes lnIn{from{opacity:0;transform:translateX(-12px)}}
#confetti{position:fixed;inset:0;z-index:260;pointer-events:none}
/* ===== onboarding ===== */
.onb{min-height:calc(100vh - 40px);display:flex;flex-direction:column;animation:slideIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}}
.dots{display:flex;gap:6px;margin:6px 0 22px}
.dots i{height:5px;flex:1;border-radius:9px;background:var(--bg3)}
.dots i.on{background:var(--grad)}
.hero-logo{font-family:'Barlow Condensed';font-weight:800;font-size:3.6rem;line-height:.9;letter-spacing:1px;margin-top:12vh}
.hero-logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg3);margin-top:8px;cursor:pointer}
.opt.on{border-color:var(--acc);background:rgba(255,107,44,.1)}
.opt .e{font-size:1.4rem}
.dayp{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dayp div{text-align:center;padding:14px 0;border-radius:12px;background:var(--bg3);border:1px solid var(--line);font-weight:800;font-size:.8rem;cursor:pointer}
.dayp div.on{background:var(--grad);color:#1a0d05;border-color:transparent;animation:pop .35s}
.exo{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:var(--bg3);margin-top:7px;cursor:pointer}
.exo.on{border-color:var(--acc);background:rgba(255,107,44,.09)}
.exo .tick{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;color:#1a0d05;flex-shrink:0;font-size:.8rem}
.exo.on .tick{background:var(--grad);border-color:transparent}
.grp{margin-top:18px}
.grp summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed';font-weight:800;font-size:1.2rem}
.grp summary::-webkit-details-marker{display:none}
/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{text-align:center;padding:12px 6px;border-radius:14px;background:var(--bg3);border:1px solid var(--line)}
.bdg .e{font-size:1.8rem;filter:grayscale(1);opacity:.35}
.bdg .n{font-size:.68rem;font-weight:700;margin-top:4px;color:var(--faint)}
.bdg.on{border-color:rgba(255,176,59,.5);background:rgba(255,176,59,.08)}
.bdg.on .e{filter:none;opacity:1;animation:pop .5s}
.bdg.on .n{color:var(--txt)}
canvas.chart{width:100%;height:auto;display:block}
.macro{text-align:center}
.macro .v{font-family:'Barlow Condensed';font-weight:800;font-size:1.5rem}
.macro .l{font-size:.68rem;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.counter{display:flex;align-items:center;gap:8px;margin-top:8px}
.counter .v{font-family:'Barlow Condensed';font-weight:800;font-size:1.4rem;min-width:90px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;
  animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="timer"><div class="in">
  <button onclick="Timer.add(-15)">−15</button><div class="t" id="timer-t">0:00</div>
  <button onclick="Timer.add(15)">+15</button><button onclick="Timer.stop()">✕</button></div></div>
<nav id="nav"></nav>
<div id="modal" onclick="if(event.target===this)Modal.close()"><div class="box" id="modal-box"></div></div>
<div class="toast" id="toast"></div>
<div id="celebrate"></div>
<canvas id="confetti"></canvas>
<script>
/* ================================================================
   IRONMODE — coach de salle pour débutant
   Programme 5 séances/semaine (jambes 1×), cycles de 8 semaines,
   double progression automatique, macros calculées, missions + XP.
   Données 100 % locales (localStorage, clé propre à cette appli).
   ================================================================ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r=(v,step)=>Math.round(v/step)*step;
const fmt=v=>(Math.round(v*100)/100).toLocaleString('fr-FR');
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const iso=d=>{ const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };

/* ---------- cycle de 8 semaines ---------- */
function phaseOf(cw){
  if(cw<=2) return {n:'Apprentissage',e:'📘',rir:3,d:'Charges légères : apprends les gestes parfaitement. Garde 3 reps en réserve.',adj:(s,i)=>Math.max(2,s-1)};
  if(cw<=5) return {n:'Progression',e:'📈',rir:2,d:'Ajoute des reps puis des kilos (double progression). Garde 2 reps en réserve.',adj:s=>s};
  if(cw<=7) return {n:'Intensification',e:'🔥',rir:1,d:'Les 2 premiers exercices ont 1 série de plus. Garde 1 rep en réserve.',adj:(s,i)=>i<2?s+1:s};
  return {n:'Décharge',e:'🧘',rir:4,d:'Semaine légère : −10 % de charge et moitié moins de séries. C’est là que le corps assimile.',adj:s=>Math.max(1,Math.ceil(s/2)),deload:1};
}

/* ================== CALCULS NUTRITION ================== */
function weightPts(){ return Object.keys(S.weights).sort().map(k=>({x:k,y:S.weights[k]})); }
function avgAround(pts,end,days){ const l=pts.filter(p=>{ const d=daysBetween(p.x,end); return d>=0&&d<days; });
  return l.length? l.reduce((a,p)=>a+p.y,0)/l.length : null; }
function currentWeight(){ const p=weightPts(); return p.length? avgAround(p,p[p.length-1].x,7) : S.profile.weight; }
function calc(){
  const P=S.profile, w=currentWeight(), h=P.height, a=P.age;
  const bmr=10*w+6.25*h-5*a+(P.sex==='f'?-161:5);
  const fact={sed:1.45,mod:1.55,act:1.7}[P.act]||1.55; // inclut 5 séances/semaine
  const tdee=bmr*fact, diff=P.target-w;
  let goal, kcal, rate;
  if(Math.abs(diff)<1){ goal='maintien'; kcal=tdee; rate=0; }
  else if(diff<0){ goal='perte'; kcal=tdee-Math.min(500,tdee*0.2); rate=-Math.max(0.3,Math.min(0.7,w*0.005)); }
  else { goal='prise'; kcal=tdee+250; rate=0.25; }
  kcal=r(kcal+(P.kcalAdj||0),10);
  const bmi=w/((h/100)**2), refW=bmi>27?P.target:w;
  const p=Math.round(2*refW), f=Math.round(Math.max(0.8*w,kcal*0.25/9)), c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
  const weeks=rate? Math.ceil(Math.abs(diff/rate)) : 0;
  const water=Math.round((w*0.035+0.5)*10)/10;
  return {bmr,tdee,kcal,p,f,c,goal,rate,weeks,eta:weeks?addDays(today(),weeks*7):null,bmi,w,diff,water,glasses:Math.ceil(water/0.25)};
}

/* ================== PROGRAMME ================== */
function weekIndex(d){ return Math.floor(daysBetween(S.profile.startDate,d)/7)+1; }
function cycleWeek(d){ const w=Math.max(1,weekIndex(d)); return ((w-1)%8)+1; }
function cycleNum(d){ return Math.floor((Math.max(1,weekIndex(d))-1)/8)+1; }
function trainDays(){ return [...S.profile.days].sort((a,b)=>a-b); }
function slotOfDate(d){ return trainDays().indexOf(dow(parse(d))); } // -1 = repos
function pool(g,k){
  const chosen=Object.keys(EX).filter(id=>S.picks[id]&&EX[id].g===g&&EX[id].k===k);
  const all=[...chosen,...(DEF[g+'_'+k]||[]),...Object.keys(EX).filter(id=>EX[id].g===g&&EX[id].k===k)];
  return {chosen, all:[...new Set(all)]};
}
function resolve(g,k,n,used){
  const {chosen,all}=pool(g,k);
  if(n<chosen.length&&!used.has(chosen[n])) return chosen[n];
  return all.find(id=>!used.has(id))||all[0];
}
function buildSession(slot,date){
  const tpl=TPL[slot], ph=phaseOf(cycleWeek(date)), used=new Set(), dr=S.drafts[date], sw=(dr&&dr.slot===slot&&dr.swaps)||{};
  const items=tpl.slots.map((s,i)=>{
    const id=sw[i]||resolve(s.g,s.k,s.n,used); used.add(id);
    const ex=EX[id], hold=!!ex.hold;
    return {id,ex,i,sets:ph.adj(s.sets,i),lo:hold?30:s.lo,hi:hold?45:s.hi,rest:s.rest,hold};
  });
  return {slot,tpl,ph,items};
}
function sessionSlot(date){ const d=S.drafts[date]; return d&&d.slot!=null? d.slot : slotOfDate(date); }
function logOn(date){ return S.logs.find(l=>l.date===date); }

/* ---- historique et double progression ---- */
function lastPerf(id,before){
  const l=S.logs.filter(x=>x.date<before&&x.ex.some(e=>e.id===id&&e.sets.length)).sort((a,b)=>b.date.localeCompare(a.date))[0];
  return l? {date:l.date, sets:l.ex.find(e=>e.id===id).sets} : null;
}
const e1rm=(w,reps)=>w*(1+reps/30);
const isAssist=id=>EX[id].inc<0;
function bestE1(id,exceptLog){
  let b=0; S.logs.forEach(l=>{ if(l.id===exceptLog) return; l.ex.forEach(e=>{ if(e.id!==id) return;
    e.sets.forEach(s=>{ const v=EX[id].hold? s.r : e1rm(s.w,s.r); if(v>b) b=v; }); }); }); return b;
}
function suggest(it,date,deload){
  const lp=lastPerf(it.id,date), ex=it.ex, unit=it.hold?'s':' reps';
  if(!lp) return {w:'', txt: it.hold? `1ʳᵉ fois : tiens ${it.lo} s en gardant une position parfaite.`
    : ex.bw? `1ʳᵉ fois : au poids du corps, fais ${it.lo}–${it.hi} reps propres.`
    : isAssist(it.id)? `1ʳᵉ fois : choisis l’assistance qui te permet ${it.hi} reps propres.`
    : `1ʳᵉ fois : trouve une charge où tu fais ${it.hi} reps en gardant 2–3 reps en réserve. Note-la.`};
  const top=Math.max(...lp.sets.map(s=>s.w)), at=lp.sets.filter(s=>s.w===top);
  const allTop=at.every(s=>s.r>=it.hi), anyLow=at.some(s=>s.r<it.lo);
  let w=top, txt;
  if(deload){ w=ex.inc? Math.max(0,r(top*(isAssist(it.id)?1.1:0.9),0.5)) : top; txt=`Décharge : ${w?fmt(w)+' kg':'poids du corps'}, reps faciles.`; }
  else if(allTop){
    if(ex.inc){ w=Math.max(0,top+ex.inc); txt=`🔥 ${it.hi}${unit} atteints partout → ${isAssist(it.id)?'moins d’assistance':'+'+fmt(Math.abs(ex.inc))+' kg'} ! Vise ${it.lo}+${unit}.`; }
    else txt= it.hold? `Objectif atteint → ajoute 10 s ou passe à une variante plus dure.` : `Objectif atteint → ajoute 1–2 reps ou un peu de lest.`;
  }
  else if(anyLow) txt=`Garde ${w?fmt(w)+' kg':'la même charge'} et vise ${it.lo}${unit} minimum sur chaque série.`;
  else txt=`Garde ${w?fmt(w)+' kg':'la même charge'} et ajoute 1 rep par série (objectif ${it.hi}${unit}).`;
  return {w, txt, last:lp};
}

/* ---- brouillon de séance ---- */
function draftFor(date,sess){
  let d=S.drafts[date];
  const sig=sess.items.map(i=>i.id+i.sets).join('|');
  if(!d||d.slot!==sess.slot||d.sig!==sig){
    const old=d&&d.slot===sess.slot? d : null;
    d={slot:sess.slot, sig, swaps:(old&&old.swaps)||{}, start:(old&&old.start)||null,
      ex:sess.items.map((it,i)=>{ const sg=suggest(it,date,sess.ph.deload); const prev=old&&old.ex&&old.ex[i]&&old.sig&&old.sig.split('|')[i]===it.id+it.sets?old.ex[i]:null;
        return prev||{sets:Array.from({length:it.sets},()=>({w:sg.w, r:'', done:false}))}; })};
    S.drafts[date]=d; save();
  }
  return d;
}

/* ================== MISSIONS / XP / NIVEAUX ================== */
function day(d){ S.daily[d]=S.daily[d]||{prot:0,water:0,m:{}}; return S.daily[d]; }
function missions(d){
  const c=calc(), train=slotOfDate(d)>=0||!!logOn(d);
  return [
    train? {id:'seance',t:'Faire ta séance',e:'🏋️',auto:1} : {id:'recup',t:'Récup active : 20 min de marche ou étirements',e:'🚶'},
    {id:'prot',t:`Atteindre ${c.p} g de protéines`,e:'🥩',auto:1},
    {id:'eau',t:`Boire ${fmt(c.water)} L d’eau`,e:'💧',auto:1},
    {id:'sommeil',t:'Dormir 7 h 30 minimum',e:'😴'},
    {id:'pas',t:'Faire 7 000 pas',e:'👟'},
  ];
}
function mDone(d,id){
  const x=S.daily[d]||{prot:0,water:0,m:{}}, c=calc();
  if(id==='seance') return !!logOn(d);
  if(id==='prot') return x.prot>=c.p;
  if(id==='eau') return x.water>=c.glasses;
  return !!x.m[id];
}
function doneCount(d){ return missions(d).filter(m=>mDone(d,m.id)).length; }
function streak(){
  let n=0, d=today(); if(doneCount(d)<3) d=addDays(d,-1);
  for(let i=0;i<500;i++){ if(doneCount(d)>=3){ n++; d=addDays(d,-1);} else break; }
  return n;
}
function logStats(l){ let sets=0,ton=0; l.ex.forEach(e=>e.sets.forEach(s=>{ sets++; if(!isAssist(e.id)&&!EX[e.id].hold) ton+=s.w*s.r; })); return {sets,ton}; }
function xpTotal(){
  let xp=0;
  S.logs.forEach(l=>{ xp+=100+5*logStats(l).sets+30*(l.prs||0); });
  Object.keys(S.daily).forEach(d=>{ xp+=10*doneCount(d); });
  return xp+50*Object.keys(S.badges).length;
}
const lvlOf=xp=>Math.floor((Math.sqrt(1+8*xp/400)-1)/2)+1;
const xpFor=l=>400*(l-1)*l/2;
function titleOf(l){ let t=TITLES[0][1]; TITLES.forEach(x=>{ if(l>=x[0]) t=x[1]; }); return t; }

function stats(){
  const P=S.profile, n=S.logs.length, legs=S.logs.filter(l=>l.slot===2).length;
  const byWeek={}; S.logs.forEach(l=>{ const w=weekIndex(l.date); byWeek[w]=(byWeek[w]||0)+1; });

function buzz(p){ if(S.settings.vibrate&&navigator.vibrate) navigator.vibrate(p); }
function beep(notes){ if(!S.settings.sound) return; try{ const c=new (window.AudioContext||window.webkitAudioContext)();
  notes.forEach(([f,t,d])=>{ const o=c.createOscillator(),g=c.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(.0001,c.currentTime+t); g.gain.exponentialRampToValueAtTime(.22,c.currentTime+t+.02);

const REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

    requestAnimationFrame(f); }); }
function ring(pct,size,stroke,label,sub,color){

function addProt(v){ const d=day(today()); d.prot=Math.max(0,d.prot+v); save(); if(v>0) buzz(10); render(); checkProgress(); }
function addWater(v){ const d=day(today()); d.water=Math.max(0,d.water+v); save(); if(v>0) buzz(10); render(); checkProgress(); }
function autoAdjust(c){
  const p=weightPts(); if(p.length<8||c.goal==='maintien') return null;
  const last=p[p.length-1].x; if(daysBetween(p[0].x,last)<14) return null;
  const a=avgAround(p,last,7), b=avgAround(p,addDays(last,-7),7); if(a==null||b==null) return null;
  const tr=a-b;
  if(c.goal==='perte'&&tr>-0.1) return {v:-150,txt:`Ton poids n’a presque pas bougé cette semaine (${tr>0?'+':''}${fmt(r(tr,0.1))} kg). On baisse légèrement les calories.`};
  if(c.goal==='perte'&&tr<-1) return {v:150,txt:`Tu perds trop vite (${fmt(r(tr,0.1))} kg/semaine) : risque de perdre du muscle. On remonte un peu.`};
  if(c.goal==='prise'&&tr<0.05) return {v:150,txt:`Ton poids stagne (${tr>0?'+':''}${fmt(r(tr,0.1))} kg/semaine). Pour construire du muscle, on ajoute un peu.`};
  if(c.goal==='prise'&&tr>0.6) return {v:-150,txt:`Tu prends trop vite (+${fmt(r(tr,0.1))} kg/semaine) : c’est surtout du gras. On réduit un peu.`};
  return null;
}

  S.weights[today()]=v; save(); Modal.close(); toast('Pesée enregistrée ⚖️'); render(); checkProgress(); }
function drawWeight(){
  const cv=$('ch-w'); if(!cv) return; const x=cv.getContext('2d'), W=cv.width, H=cv.height, L=46, B=30, T=16, pts=weightPts(), tg=S.profile.target;
  x.clearRect(0,0,W,H); x.font='18px Inter,sans-serif'; x.fillStyle='#5b6378';
  if(!pts.length){ x.fillText('Aucune pesée pour l’instant',L,H/2); return; }
  const t0=parse(pts[0].x).getTime(), t1=Math.max(parse(pts[pts.length-1].x).getTime(),t0+6*864e5);
  const ys=pts.map(p=>p.y).concat([tg]); const lo=Math.min(...ys)-0.6, hi=Math.max(...ys)+0.6;
  const px=d=>L+(parse(d).getTime()-t0)/(t1-t0)*(W-L-16), py=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  x.strokeStyle='#252c3f'; x.lineWidth=1;
  for(let g=0;g<=3;g++){ const v=lo+(hi-lo)*g/3; x.beginPath(); x.moveTo(L,py(v)); x.lineTo(W-8,py(v)); x.stroke(); x.fillStyle='#5b6378'; x.fillText(fmt(r(v,0.1)),2,py(v)+6); }
  x.setLineDash([8,6]); x.strokeStyle='#2ee59d'; x.lineWidth=2; x.beginPath(); x.moveTo(L,py(tg)); x.lineTo(W-8,py(tg)); x.stroke(); x.setLineDash([]);
  x.fillStyle='rgba(255,176,59,.55)'; pts.forEach(p=>{ x.beginPath(); x.arc(px(p.x),py(p.y),4.5,0,7); x.fill(); });
  const g=x.createLinearGradient(0,0,W,0); g.addColorStop(0,'#ff6b2c'); g.addColorStop(1,'#ffb03b');
  x.strokeStyle=g; x.lineWidth=4; x.shadowColor='#ff6b2c'; x.shadowBlur=12; x.lineJoin='round'; x.beginPath();
  pts.forEach((p,i)=>{ const a=avgAround(pts,p.x,7); i?x.lineTo(px(p.x),py(a)):x.moveTo(px(p.x),py(a)); }); x.stroke(); x.shadowBlur=0;
  x.fillStyle='#5b6378'; x.font='16px Inter,sans-serif'; x.fillText(pts[0].x.slice(5).split('-').reverse().join('/'),L-6,H-6);
  if(pts.length>1) x.fillText(pts[pts.length-1].x.slice(5).split('-').reverse().join('/'),W-60,H-6);
}

  if(sg!==_sig){ _sig=sg; a.classList.remove('enter'); void a.offsetWidth; a.classList.add('enter'); countUp(a); } else a.classList.remove('enter');
  if(tab==='prog'&&psub==='poids') setTimeout(drawWeight,0);
}
render();
if(S.profile) checkProgress();
</script>
